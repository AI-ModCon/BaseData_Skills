  ClassificationLevelEnum:
    description: >-
      Controlled vocabulary for the official classification level, if the asset is classified.
      
      Can be used for filtering and discovery in catalogs.
    permissible_values:
      - Top_Secret
      - Secret
      - Confidential

  ClassificationCategoryEnum:
    description: >-
      Controlled vocabulary for the official classification category/categories, if applicable.
      
      Can be used for filtering and discovery in catalogs.
    permissible_values:
      NSI:
        description: >-
          National Security Information datasets, including data related to national defense, intelligence, and security operations.
          
          Can include Top Secret, Secret, and Confidential information that is not related to nuclear weapons or materials.
      RD:
        description: >-
          Comprises all data related to: the design, manufacture, or use of nuclear weapons; 
          production of special nuclear material (SNM); 
          or use of SNM in the production of energy. 
          RD does not include data removed from the Restricted Data category, 
          i.e., data that is designated Formerly Restricted Data (FRD) or Transclassified Foreign Nuclear Information (TFNI).
      FRD:
        description: >-
          Formerly Restricted Data datasets, still a category of classified information related to nuclear weapons. 
          It does not mean it is formerly classified and therefore is now unclassified. 
          FRD is jointly determined by DoD and DOE to relate primarily to the military use of nuclear weapons, and is safeguarded as defense information (e.g., weapon yield, deployment locations, weapons safety and storage, and stockpile quantities).
      TFNI:
        description: >-
          Transclassified Foreign Nuclear Information datasets, information from any intelligence source 
          that concerns the nuclear programs of foreign governments that was removed from the RD category (by transclassification) 
          under section 142 of the Atomic Energy Act, by past joint agreements between DOE and the Director of Central Intelligence, 
          or past and future agreements with the Director of National Intelligence. 
          When removed from the RD category, TFNI information is stored, transmitted, and destroyed in the same ways as NSI of the same classification level. 
          DoD and DOE have separate systems for controlling nuclear information.
      "Other_Classified":
        description: >-
          Other classified datasets that do not fall under the NSI, RD, FRD, or TFNI categories, but are still classified under EO 13526 or other applicable classification authorities. 
            This can include datasets related to sensitive intelligence sources and methods, classified research and development projects, and other types of classified information that require protection.

