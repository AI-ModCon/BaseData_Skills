# ---------------------------------------------------------------------------
# Subsets
# ---------------------------------------------------------------------------
subsets:
  # Subset of DataCard metadata elements
  # Corresponds to annotations in the datacard template and guidance to indicate which fields are required for different intended uses.
  required:
    description: >-
      Required for all datacards, regardless of intended use or sharing level and use.
  discoverability_required:
    description: >-
      These essential fields are designed to facilitate discovery using the datacard metadata.
      These encompass the minimum set of metadata fields that should be included in all datacards for datasets
      in catalogs and repositories, to support basic findability.
  discoverability_if_applicable:
    description: >-
      Optional, but recommended, for datacards of datasets that are intended to be discoverable 
      in catalogs and repositories, to support basic findability.
      These fields may not be applicable to all datasets, 
      but should be included when relevant and available to enhance discoverability and provide important context 
      for users, both humans and machines.
  accessibility_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be shared or accessed by others, 
      whether internally within a project or organization, with external collaborators, or publicly.
      These fields provide critical information about how the dataset can be accessed, requested, retrieved, cited, and reused by others, 
      in addition to information on how to contact the point of contact(s) for access requests, and any restrictions or requirements for access, 
      which is essential for enabling accessibility and reuse of the dataset by others.
  accessibility_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be shared or accessed by others, 
      whether internally within a project or organization, with external collaborators, or publicly.
      They provide additional information about how to access the dataset, 
      including any restrictions or requirements for access, which can enhance accessibility and support reuse of the dataset by others.
      They may not be applicable to all datasets, but should be included when relevant and available to provide important context for users, both humans and machines, about how to access the dataset.
  interoperability_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be interoperable, 
      meaning they are intended to be integrated with other datasets or systems, or used in combination with other datasets.
      These fields provide critical information about the meaning, data representation and structure, provenance, 
      related resources and integrity of the dataset.
  interoperability_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be interoperable.
      They provide additional information about the meaning, data representation and structure, provenance, 
      related resources and integrity of the dataset that can enhance interoperability and support integration with other datasets or systems.
      They may not be applicable to all datasets, but should be included when relevant and available.
  reusability_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be reusable, 
      meaning they are intended to be reused by others for the same or different purposes.
      These fields provide critical information about the the authorship, license, stewardship, and data_quality.
      This information is essential for enabling reuse of the dataset by others, 
      as it informs users about the permissions, responsibilities, and quality of the dataset, 
      which are key factors in determining whether and how a dataset can be reused for a particular purpose.
  reusability_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be reusable.
      They provide additional information about the license, stewardship, 
      and data quality of the dataset that can enhance reuse and support informed decision-making by users about 
      whether and how to reuse the dataset for a particular purpose.
      These include optional domain-specific metadata fields that can provide important context about the dataset for users in specific scientific domains, 
      such as scientific domain, data type, and experimental method, which can be critical for determining the relevance and 
      suitability of the dataset for specific research questions or analyses.
      They may not be applicable to all datasets, but should be included when relevant and available to provide important context for users, 
      both humans and machines, about the reuse potential of the dataset.
  governed_use_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be shared or accessed under specific governance or oversight, 
      such as datasets that are subject to security controls, export control, IRB oversight, or other types of formal review and approval processes.
      These fields provide critical information about the governance and oversight for the dataset, 
      which is essential for ensuring that the dataset is shared and accessed in compliance with applicable regulations,
      policies, and ethical considerations, and for enabling responsible use of the dataset by others.
  governed_use_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be shared or accessed under specific governance or oversight.
      They provide additional information about the governance and oversight for the dataset that can enhance responsible sharing and use of the dataset by others.
      They may not be applicable to all datasets, but should be included when relevant and available to provide important context for users, both humans and machines, about the governance and oversight for the dataset.
  ai_usability_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be used for AI training, evaluation, or other AI-related purposes.
      These fields provide critical information about the allowed ai use for AI purposes.
      This information is essential for enabling responsible use of the dataset for AI purposes by others, 
      as it informs users about the permissions, restrictions, and requirements for using the dataset for AI purposes, 
      which are key factors in determining whether and how a dataset can be used by AI.
  ai_usability_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be used for AI training, evaluation, or other AI-related purposes.
      They provide additional information about the restrictions, biases, risks, safety considerations, and other factors related to using the dataset for AI purposes 
      that can enhance responsible use of the dataset for AI purposes by others.
      They may not be applicable to all datasets, but should be included when relevant and available to provide important context for users, 
      both humans and machines, about the usability of the dataset for AI purposes.
  reference_only_do_not_include:
    description: >-
      These fields are provided for reference only and should not be included in a final, completed datacard.

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:
  supports_discoverability:
    range: YesNoEnum
    pattern: "Yes"
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - "Yes" is required for all datacards to indicate whether the dataset described in the datacard is intended to be discoverable in catalogs and repositories, to support basic findability.
      Indicates whether the dataset described in the datacard is intended to be discoverable in catalogs and repositories, to support basic findability.
      
      This is a high-level indication of whether the dataset is intended to be discoverable, 
      and does not necessarily indicate that the dataset is currently discoverable or that it meets all criteria for discoverability.

  supports_accessibility:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be shared or accessed by others, whether internally within a project or organization, with external collaborators, or publicly.
      
      This is a high-level indication of whether the dataset is intended to be accessible, 
      and does not necessarily indicate that the dataset is currently accessible or that it meets all criteria for accessibility.

  supports_interoperability:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be interoperable, meaning it is intended to be integrated with other datasets or systems, or used in combination with other datasets.
      
      This is a high-level indication of whether the dataset is intended to be interoperable, 
      and does not necessarily indicate that the dataset is currently interoperable or that it meets all criteria for interoperability.

  supports_reusability:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be reusable, meaning it is intended to be reused by others for the same or different purposes.
      
      This is a high-level indication of whether the dataset is intended to be reusable, 
      and does not necessarily indicate that the dataset is currently reusable or that it meets all criteria for reusability.
  
  supports_governed_use:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be shared or accessed under specific governance or oversight, such as datasets that are subject to security controls, export control, IRB oversight, or other types of formal review and approval processes.
      
      This is a high-level indication of whether the dataset is intended to be shared or accessed under specific governance or oversight, 
      and does not necessarily indicate that the dataset is currently shared or accessed under specific governance or oversight, or that it meets all criteria for governed use.
    
  supports_ai_usability:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be used for AI training, evaluation, or other AI-related purposes.
      
      This is a high-level indication of whether the dataset is intended to be used for AI purposes, 
      and does not necessarily indicate that the dataset is currently used for AI purposes or that it meets all criteria for AI usability.

  discoverability:
    range: DiscoverabilityClass
    inlined: true
    in_subset:
      - discoverability_required
    description: >-
      Metadata fields that support the discoverability of the dataset,
      which is a key aspect of the FAIR principles and essential for enabling users to find and access the dataset in catalogs and repositories.
      
      These fields provide critical information about the dataset that can enhance its discoverability and help users understand its relevance and suitability for their needs.
      
      The discoverability capability is required for all datacards to support basic findability in catalogs and repositories, but the specific fields

  accessibility:
    range: AccessibilityClass
    inlined: true
    in_subset:
      - accessibility_required
    description: >-
      Metadata fields that support the accessibility of the dataset,
      which is a key aspect of the FAIR principles and essential for enabling users to access and use the dataset.
      
      These fields provide critical information about how to access the dataset, including any restrictions or requirements for access, which can enhance accessibility and support reuse of the dataset by others.
      
      The accessibility capability is required for datacards of datasets that are intended to be shared or accessed by others, whether internally within a project or organization, with external collaborators, or publicly.

  interoperability:
    range: InteroperabilityClass
    inlined: true
    in_subset:
      - interoperability_required
    description: >-
      Metadata fields that support the interoperability of the dataset,
      which is a key aspect of the FAIR principles and essential for enabling users to integrate the dataset with other datasets or systems, or use it in combination with other datasets.
      
      These fields provide critical information about the meaning, data representation and structure, provenance, related resources and integrity of the dataset that can enhance interoperability and support integration with other datasets or systems.
      
      The interoperability capability is required for datacards of datasets that are intended to be interoperable, meaning they are intended to be integrated with other datasets or systems, or used in combination with other datasets.

  reusability:
    range: ReusabilityClass
    inlined: true
    in_subset:
      - reusability_required
    description: >-
      Metadata fields that support the reusability of the dataset,
      which is a key aspect of the FAIR principles and essential for enabling users to reuse the dataset for the same or different purposes.
      
      These fields provide critical information about the authorship, license, stewardship, and data quality of the dataset that can enhance reuse and support informed decision-making by users about whether and how to reuse the dataset for a particular purpose.
      
      The reusability capability is required for datacards of datasets that are intended to be reusable, meaning they are intended to be reused by others for the same or different purposes.

  governed_use:
    range: GovernedUseClass
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Metadata fields that support the governed use of the dataset,
      which is essential for ensuring that the dataset is shared and accessed in compliance with applicable regulations,
      policies, and ethical considerations, and for enabling responsible use of the dataset by others.
      These fields provide critical information about the governance and oversight for the dataset,
      which can enhance responsible sharing and use of the dataset by others.
      The governed_use capability is required for datacards of datasets that are intended to be shared or accessed 
      under specific governance or oversight, such as datasets that are subject to security controls, 
      export control, or other types of formal review and approval processes.

  ai_usability:
    range: AIUsabilityClass
    inlined: true
    in_subset:
      - ai_usability_required
    description: >-
      Metadata fields that support the AI usability of the dataset,
      which is essential for enabling responsible use of the dataset for AI purposes by others.
      
      These fields provide critical information about the allowed ai use for AI purposes, as well as 
      any restrictions, biases, risks, safety considerations, and other factors related to using the dataset 
      for AI purposes that can enhance responsible use of the dataset for AI purposes by others.
      
      The ai_usability capability is required for datacards of datasets 
      that are intended to be used for AI training, evaluation, or other AI-related purposes.

  name:
    identifier: true
    required: true
    range: string
    description: "Human-readable name or local string key for the entity."

  description:
    range: string
    description: "Detailed description of the entity."
    exact_mappings:
      - schema:description
      - dcterms:description
      - datacite:description
  
  datacard:
    range: DataCardClass
    inlined: true
    description: >-
      Metadata about the datacard itself (not the dataset), 
      including its sensitivity, creation method, and change log."
    required: true
    broad_mappings:
      - prov:Entity
  
  version:
    range: string
    description: "Version of software, tool, or library."
    pattern: '^\d+\.\d+(\.\d+)?$'
  
  template_version:
    range: string
    ifabsent: string(1.0.0)
    pattern: '^\d+\.\d+(\.\d+)?$'
    in_subset:
      - discoverability_required
    description: "The version of the datacard template used to create this datacard."
    required: true
  
  datacard_version:
    range: string
    ifabsent: string(1.0.0)
    pattern: '^\d+\.\d+(\.\d+)?$'
    in_subset:
      - discoverability_required
    description: >-
      Increment when the datacard is meaningfully updated.
      Use semantic versioning: MAJOR.MINOR.PATCH
      e.g., 1.0 → 1.1 for content updates; 1.x -> 2.0 for structural changes
    required: true
  
  filename:
    range: string
    pattern: '^genesis_datacard_[a-z0-9]+(?:_[a-z0-9]+)*\.(md|ya?ml)$'
    in_subset:
      - discoverability_required
    aliases:
      - file_name
      - datacard_filename
      - datacard_file_name
    description: >-
      The filename of the datacard document, follow naming convention: "genesis_datacard_${SNAKE_CASE_DATASET_NAME}$.md"
    required: true
  
  language:
    range: string
    pattern: '^[a-z]{2}$|^not_applicable$'
    ifabsent: string(en)
    in_subset:
      - discoverability_required
    description: "The language of the datacard content, following ISO 639-1 codes (e.g., 'en' for English)."
    required: true
    exact_mappings:
      - schema:inLanguage
      - dcterms:language
      - datacite:language
  
  id:
    range: IdentifierClass
    in_subset:
      - discoverability_if_applicable
    aliases:
      - identifier
      - datacard_id
      - datacard_identifier
      - PID
      - datacard_pid
    description: >-
      A unique identifier for the datacard document itself, following the format: "doi:
      distinct from the dataset identifier.

      Assign if the datacard is registered in a catalog or repository independently of the dataset.
    required: true
    broad_mappings:
      - schema:identifier
      - dcterms:identifier
      - datacite:identifier
  
  identifier:
    range: IdentifierClass
    in_subset:
      - interoperability_if_applicable
    aliases:
      - id
    description: >-
      A unique identifier for the datacard document itself, following the format: "doi:
      distinct from the dataset identifier. Assign if the datacard is registered in a catalog or repository independently of the dataset.
    required: true
    broad_mappings:
      - schema:identifier
      - dcterms:identifier
      - datacite:identifier

  type:
    range: IdentifierTypeEnum
    in_subset:
      - interoperability_if_applicable
    description: >-
      The type of the Identifer (e.g., DOI, UUID, ARK), following a controlled vocabulary of identifier types.
      
      Assign if the datacard has an identifier; required if 'id' is provided.
    broad_mappings:
      - datacite:identifierType
  
  value:
    range: string
    required: false
    pattern: '^.*$'
    description: >-
      The value of the identifier (e.g., "10.1234/abcd"), following the format specified by the 'type' field.
     
      Assign if the datacard has an identifier; required if 'id' is provided.
    broad_mappings:
      - schema:identifier
      - dcterms:identifier
      - datacite:identifier

  sensitivity:
    range: SensitivityClass
    inlined: true
    in_subset:
      - discoverability_required
    aliases:
      - datacard_sensitivity
      - "Genesis Sensitivity"
    description: >-
      Metadata fields that capture the sensitivity of the datacard and the dataset it describes,
      which is critical for ensuring proper handling and access controls based on the sensitivity of the asset.
      
      These fields provide important context about the sensitivity of the dataset, 
      which can inform filtering and discovery in catalogs, 
      but authoritative source markings and metadata fields should be used for access control and governance decisions.
      
      NOTE: Sensitivity terminology is still under Genesis governance review. Vocabulary may evolve.
  
  overall_sensitivity:
    range: OverallSensitivityEnum
    required: true
    in_subset:
      - discoverability_required
    aliases:
      - datacard_sensitivity
      - overall_sensitivity_level
    description: >-
      Human-readable top-level sensitivity posture of the asset.
      This is a summary field only and does not replace the authoritative
      fields such as the classification_status, classification_level, export_control_basis, or privacy_control_basis fields.
      
      This can be used for filtering and discovery in catalogs, but authoritative source markings and metadata fields
      should be used for access control and governance decisions.
      
      Uses the OverallSensitivityEnum controlled vocabulary, which includes values such as:
      public | unclassified_uncontrolled | cui | ucni | classified | legacy_controlled | mixed | other_controlled
      
      Use "public" for unclassified, non-sensitive assets that can be shared publicly.
    broad_mappings:
      - schema:specialUsageRestriction
      - dcterms:rights
      - datacite:rights

  source_marking_string:
    range: string
    required: true
    multivalued: false
    in_subset:
      - discoverability_required
    aliases:
      - marking
      - official_marking
      - source_marking
      - source_markings
      - marking_string
      - marking_banner
      - control_text
    description: >-
      Exact marking/banner/control text as it appears on the source artifact
      or in the authoritative review/release output, if applicable.
     
      This provides the authoritative source marking information for the asset, which is critical for ensuring proper handling and access controls based on the sensitivity of the asset.
     
      If no source markings apply to the asset, this field should be filled with "not_applicable".
      
      If the asset has multiple source markings, list them separated by // with no spaces
      
      Examples:
      "not_applicable" | "CUI//SP-EXPT//NOFORN" | "SECRET//RD//SIGMA 15" | "OFFICIAL USE ONLY"
      
      This field does not replace the individual metadata fields for classification status, 
      classification level, export control basis, or privacy control basis, 
      which should still be filled out based on the authoritative source markings.
      
      Source_marking_string is provenance-preserving and may contain source-agency-specific constructs
      not otherwise modeled in DOE-native structured fields; source_marking_scheme should identify that regime.

  source_marking_scheme:
    range: SourceMarkingSchemeEnum
    required: true
    multivalued: false
    in_subset:
      - discoverability_required
    description: >-
      Identifies the authoritative source marking regime, for the source_marking_string field, 
      following a controlled vocabulary of source marking schemes: SourceMarkingSchemeEnum.
      Examples include:
      DOE_CUI | DOE_UCNI | EO13526_Classified | AEA_RD_FRD_TFNI | DOD_CUI | DHS_CUI | Legacy_OUO | Legacy_Site_Specific | Other_Agency | None
      
      This provides important context for interpreting the source_marking_string field, as different marking schemes may have different formats and meanings for the markings.

  creation_method:
      range: DatacardCreationMethodEnum
      required: true
      in_subset:
        - discoverability_required
      description: >-
        The method by which the datacard was created, following a controlled vocabulary (e.g., manual, automated, templated).
       
        This provides context on how the datacard was generated and can inform trust and maintenance practices.

  created_date:
      range: date
      in_subset:
        - discoverability_required
      description: >-
        The date the datacard was first created, in ISO 8601 format (YYYY-MM-DD).
        
        This provides temporal context for the datacard and can be used for tracking its age and relevance.
      required: true

  updated_date:
      range: date
      in_subset:
        - discoverability_if_applicable
      description: >-
        The date the datacard was last updated, in ISO 8601 format (YYYY-MM-DD).
        Date of most recent update; revise on every change to the datacard, including minor edits and version updates.
        
        This provides temporal context for the datacard and can be used for tracking its currency and maintenance.

  change_log:
      range: ChangeLogEntryClass
      multivalued: true
      inlined: true
      inlined_as_list: true
      in_subset:
        - discoverability_required
      description: >-
        Running history of meaningful changes to this datacard.
        Add a new entry every time the datacard is updated.
        
        Do not overwrite or delete prior entries.
        
        If there have been no changes since creation, include a single entry with the creation date and the summary 'Initial creation'.
      required: true

  change_log_entry:
      range: ChangeLogEntryClass
      in_subset:
        - discoverability_required
      description: >-
        An individual entry in the change log, documenting a specific change to the datacard.
        
        Each entry should include the date of the change, the datacard version after the change, 
        and a brief summary of what was changed and why.
      required: true

  change_date:
      range: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      in_subset:
        - discoverability_required
      description: >-
        The date of a specific change to the datacard, in ISO 8601 format (YYYY-MM-DD).
        
        This provides temporal context for each change and can be used for tracking the history of the datacard.
      required: true

  summary:
      range: string
      in_subset:
        - discoverability_required
      description: >-
        A brief description of what was changed in a specific update to the datacard and why.
        Update this text for all subsequent revisions.
        This provides context for each change and can be used for understanding the evolution of the datacard over time.
        Brief description of what changed and why.
        e.g., "Updated license to CC-BY-4.0",
        e.g., "Added checksum after file transfer to OSTI",
        e.g., "Corrected collection end date",
      required: true

  created_by:
      range: CreatorClass
      multivalued: true
      inlined: true
      inlined_as_list: true
      in_subset:
        - discoverability_required
      description: >-
        All individuals, organizations, AI models, or software tools
        that created or updated this datacard. 
        List in chronological order of the contribution — e.g., if an AI model generated the initial draft
        and a person then edited it, list the AI model first followed by the person.
        This provides important provenance information about the datacard and can inform trust and maintenance practices.
      required: true

  role:
      range: RoleEnum
      identifier: false
      multivalued: true
      description: >-
        The role, using the CRediT taxonomy, of a type (person, organization, AI model, 
        or software tool) in relation to the datacard or dataset.
        CRediT roles include: Conceptualization, Data_Curation, Formal_Analysis, Funding_Acquisition, Investigation, Methodology, Project_Administration, Resources, Software, Supervision, Validation, Visualization, Writing_Original_Draft, Writing_Review_and_Editing.
        This has been extended with an Other role to capture contributions that do not fit within the CRediT taxonomy.

  contribution_date:
      range: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: >-
        ISO 8601 date of an event related to the datacard or dataset.
  
  creator:
      range: AgentClass
      in_subset:
        - discoverability_required
      description: >-
        An individual, organization, AI model, or software tool that
        created the datacard or dataset in the role indicated.
        This provides important provenance information about the datacard and 
        can inform trust and maintenance practices.

  given_name:
      range: string
      description: "The given name(s) of a person."

  family_name:
      range: string
      description: "The family name(s) of a person."

  orcid:
      range: string
      pattern: '^https?://orcid\.org/[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}$'
      description: "The ORCID identifier for a person, in URL format (e.g., https://orcid.org/0000-0002-1825-0097)."
      in_subset:
        - discoverability_if_applicable
      broad_mappings:
        - schema:sameAs
        - dcterms:identifier
        - datacite:identifier

  email:
      range: string
      pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
      description: "The email address of a person."
      in_subset:
        - discoverability_if_applicable

  affiliation:
      range: AffiliationClass
      inlined: true
      description: "An organization with which a person is affiliated."

  ror_id:
      range: string
      pattern: '^https?://ror\.org/[a-z0-9]{9}$'
      description: "The ROR identifier for an organization, in URL format (e.g., https://ror.org/03yrm5c26)."
      in_subset:
        - discoverability_if_applicable
      broad_mappings:
        - schema:sameAs
        - dcterms:identifier
        - datacite:identifier

  accessed_date:
      range: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: >-
        The date when an AI model or software tool was accessed for use in 
        creating or updating the datacard, in ISO 8601 format (YYYY-MM-DD).
  
  agent:
    range: AgentClass
    description: >-
      An entity that is a person, organization, AI model, or software tool that created or updated this datacard.
      
      This provides important provenance information about the datacard and can inform trust and maintenance practices.

  person:
    range: PersonClass
    inlined: true
    description: "A human individual."
  
  organization:
      range: OrganizationClass
      inlined: true
      description: "An organization or group of individuals."

  ai_model:
      range: AIModelClass
      inlined: true
      description: "An AI model."

  identification:
    range: DatasetIdentificationClass
    inlined: true
    in_subset:
      - discoverability_required
    description: >-
      Section of Level 1 metadata elements that identify and provide basic information about the dataset.

  dataset_description:
    range: DatasetDescriptionClass
    inlined: true
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Required, essential metadata fields that provide a high-level description of the dataset, 
      including its science domain, a description, and keywords.

  project:
    range: string
    required: true
    aliases:
      - project_name
      - genesis_project
      - sub_project
    in_subset:
      - discoverability_required
    description: >-
      Single human-readable name from the project, Genesis project or sub-project this dataset belongs to.
      e.g., genesis | genesis-fusion | genesis-lightsource
      Use the same name in the datacard filename.

  primary_id:
    range: IdentifierClass
    required: true
    aliases:
      - primary_identifier
      - main_id
      - main_identifier
      - dataset_id
      - dataset_identifier
      - PID
      - dataset_pid
    in_subset:
      - discoverability_required
    exact_mappings:
      - schema:identifier
      - dcterms:identifier
      - datacite:identifier
    description: >-
      Primary persistent identifier block for this dataset.
      type can be DOI, ARK, UUID, or any other globally unique identifier.
      value should follow the format specified by the type.
      This is the main identifier for the dataset 
      and should be globally unique and resolvable if possible.
  
  additional_ids:
    range: IdentifierClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - discoverability_if_applicable
    exact_mappings:
      - adms:identifier
    description: "Additional identifiers for this dataset."

  supersedes:
    range: IdentifierClass
    inlined: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Identifier of the prior version this dataset replaces.
  
  superseded_by:
    range: IdentifierClass
    inlined: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Identifier of the newer version that replaces this dataset.

  parent_collection:
    range: NamedIdentifierClass
    inlined: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Class collection or experimental campaign this
      dataset belongs to. Use when this dataset is one of many in a
      larger organized collection or ensemble.

  dataset_summary:
    range: string
    required: true
    in_subset:
      - discoverability_required
    description: >-
      A brief summary of the dataset, including its key characteristics and intended use.
      Recommend 1-3 sentences that provide a high-level overview of the dataset, its purpose, and its potential applications.
      This should be a concise overview that provides users with a quick 
      understanding of what the dataset is about and whether it may be relevant to their needs.

  purpose:
    range: string
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      The purpose for which the dataset was created. What gap does it fill?
      Include the scientific question or problem it was intended to address.

  collection_methodology:
    range: string
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      How was data acquired?
      e.g., experimental sensors | computational simulation |
      human annotation | derived from prior datasets

  data_characteristics:
    range: string
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Key structural and content characteristics:
      scale, dimensionality, temporal coverage, spatial resolution.

  current_use:
    range: string
    required: true
    in_subset:
      - governed_use_required
    description: >-
      For in-workflow data: what is this dataset actively
      being used for right now? Distinct from intended_use.
  
  use_governance:
    range: UseGovernanceClass
    inlined: true
    required: false
    in_subset:
      - governed_use_required
    description: >-
      Information block to guide appropriate use and prevent misuse of this dataset.
  
  intended_use:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Tasks or workflows this dataset is designed to support.
      e.g., ML training | physics analysis | benchmarking | visualization
  
  permitted_use:
    range: string
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      Uses this dataset is designed and intended to support.
      Genesis governance expects explicit permitted use metadata at the governance level,
      which is why this field is distinct from intended_use.
      Be explicit about what this dataset is suitable for, to guide users and prevent misuse.
      e.g., AI workflows | research and publication | internal analysis | educational use

  out_of_scope_use:
    range: string
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      Uses this dataset should NOT be applied to.
      e.g., clinical decision-making | real-time control systems

  prohibited_use:
    range: string
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      Uses that are explicitly prohibited for this dataset, either due to ethical considerations, safety concerns, or other governance reasons.
      Genesis governance expects explicit prohibited use metadata at the governance level,
      which is why this field is distinct from intended_use.
      Be explicit about what this dataset should not be used for, to guide users and prevent misuse.
      e.g., commercial use | AI workflows | redistribution | use by foreign nationals |clinical decision-making | real-time control systems

  need_to_know_basis:
    range: NeedToKnowBasisEnum
    required: false
    multivalued: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      If access to this dataset is restricted on a need-to-know basis, provide details about the criteria for granting access and how to request access.

      Use controlled vocabulary: "Mission Need" | "Job Duty" | "Project/Program Association" | "Agreement Defined" | "DGB Exception/Waiver"

  limitations:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: >-
      Known limitations, gaps, or caveats users should be aware of before using this dataset.

  keywords:
    range: string
    multivalued: true
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Terms that describe this dataset and aid discovery.
      Include domain terms, methods, instruments, and relevant ontology terms.
  
  object_type:
    range: ObjectTypeEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Primary type of digital object described by this datacard, following ObjectTypeEnum controlled vocabulary:
      Dataset | Model | Software | AI_Agent | Eval | Framework | Software

  product_type:
    range: ProductTypeEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Extended from OSTI Product Types. 
      Select the single best-fit from controlled vocabulary:
      Technical_Report | Paper_or_Proceedings | Journal_Article | Softare_Manual | Data | Collection | Computer_Related | Model | Agent

  dataset_type:
    range: DatasetTypeEnum
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      OSTI DOE Data Explorer type code. Select the single best-fit from the ObjectTypeEnum controlled vocabulary (e.g., GD for genomic data, IM for image, ND for numeric data).

  release_status:
    range: ReleaseStatusEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      The release status of the dataset, following a controlled vocabulary:
      Draft | Under_Review | Approved | Published | Deprecated
      | Approved | Published | Deprecated
      
      This provides important context about the lifecycle stage of the dataset 
      and can inform users about its readiness for use.

  classified_status:
    range: YesNoEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      "Yes" | "No" - Indicates whether the asset is classified.

  classification_level:
    range: ClassificationLevelEnum
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Official classification level, if the asset is classified.
      If classified_status is "Yes", the classification level of the asset, 
      following the controlled vocabulary: Top_Secret | Secret | Confidential

  classification_category:
    range: ClassificationCategoryEnum
    required: false
    multivalued: true
    list_elements_unique: true
    minimum_cardinality: 1
    in_subset:
      - discoverability_if_applicable
    description: >-
      Official classification category, if the asset is classified.
      If classified_status = "Yes", the classification category of the asset, 
      following controlled vocabulary NSI | RD | TFNI | "Other Classified"

  classified_control_markings:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Additional classified dissemination/caveat/handling markings appearing with
      classified content, e.g., NOFORN, CNWDI, SIGMA 14, SIGMA 15, ORCON,REL TO USA, GBR.
      List all that apply, each as a separate entry. 
      This provides important context for handling and access controls for classified assets.

  cui_status:
    range: YesNoEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      "Yes" | "No" - Indicates whether the asset is Controlled Unclassified Information (CUI).

  cui_basic_categories:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    minimum_cardinality: 1
    in_subset:
      - discoverability_if_applicable
    description: >-
      Basic CUI categories applicable to this asset, if it is CUI.
      Use the DOE/ISOO-authoritative CUI Basic categories or subcategories.
      List all that apply, each as a separate entry. 
      This provides important context for handling and access controls for CUI assets.

  cui_specified_categories:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    minimum_cardinality: 1
    in_subset:
      - discoverability_if_applicable
    description: >-
      Specified CUI categories applicable to this asset, if it is CUI.
      Use the DOE/ISOO-authoritative CUI Specified categories or subcategories.
      List all that apply, each as a separate entry. 
      This provides important context for handling and access controls for CUI assets.

  cui_limited_dissemination_controls:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Applicable CUI limited dissemination controls such as NOFORN, DL ONLY,
      REL TO USA, GBR, DISPLAY ONLY USA, GBR, RELIDO, or other authoritative values.
      Ordering/formatting should follow authoritative agency guidance.
      If cui_limited_dissemination_controls contains NOFORN, REL TO..., DISPLAY ONLY...,
      or similar controls, then governed_use.non_sensitivity_governance_metadata.foreign_national_access_status should be consistent with those controls.

  ucni_status:
    range: YesNoEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      "Yes" | "No" - Indicates whether the asset contains UCNI. UCNI is represented separately
      and should not be treated as an ordinary CUI category value.
      This provides important context for handling and access controls for UCNI assets.

  uk_mda_status:
    range: UKMDAStatusEnum
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      "Yes" | "No" - Indicates whether the asset is subject to UK MDA-specific handling.
      Optional and may be used where relevant to local/site governance.

  legacy_label_source:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    minimum_cardinality: 1
    in_subset:
      - discoverability_if_applicable
    description: >-
      Preserves deprecated or local historical control labels such as OUO, SBU,
      or site-specific legacy markings as provenance/source information only.

  normalized_control_basis:
    range: NormalizedControlBasisEnum
    multivalued: true
    list_elements_unique: true
    required: false
    minimum_cardinality: 1
    in_subset:
      - discoverability_if_applicable
    description: >-
      Optional interpreted control basis used for governance where source materials
      contain legacy, mixed, or non-standard constructs. This does not replace authoritative source markings.

      If source_marking_scheme = Legacy_OUO and the legacy marking is unresolved to a current standard marking, 
      this should be populated as "Legacy_Needs_Mapping" to indicate that the control basis is legacy and needs interpretation for governance purposes.

  workflow:
    range: WorkflowClass
    inlined: true
    in_subset:
      - discoverability_required
    description: >-
      Workflow & Lifecycle Block:

      Describes the technical and processing lifecycle position of the dataset. 
      
      discoverability.workflow.state   — describes the technical/processing lifecycle position of the data itself (raw → archived)
      
      reuasability.release_status   — describes the publication and governance state of the dataset record (draft → deprecated)
      
      These should be logically consistent. Common alignments:
      
      discoverability.workflow.state=raw|processing|qa|analysis → reuasability.release_status=draft
      
      discoverability.workflow.state=review                     → reuasability.release_status=under_review
      
      discoverability.workflow.state=embargo|published          → reuasability.release_status=approved|published
      discoverability.workflow.state=archived                   → reuasability.release_status=deprecated|published

  state:
    range: StateEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Current lifecycle position of the data itself, following StateEnum controlled vocabulary (e.g., raw, processing, qa, analysis, review, embargo, published, archived).
      NOTE ON DISCOVERABILITYWORKFLOW STATE vs. REUSABILITY RELEASE STATUS:
      discoverability.workflow.state   — describes the technical/processing lifecycle position of the data itself (raw → archived)
          reuasability.release_status   — describes the publication and governance state of the dataset record (draft → deprecated)
      These should be logically consistent. Common alignments:
        discoverability.workflow.state=raw|processing|qa|analysis → reuasability.release_status=draft
        discoverability.workflow.state=review                     → reuasability.release_status=under_review
        discoverability.workflow.state=embargo|published          → reuasability.release_status=approved|published
        discoverability.workflow.state=archived                   → reuasability.release_status=deprecated|published

  is_intermediate:
    range: YesNoEnum
    in_subset:
      - discoverability_if_applicable
    description: >-
      "Yes" | "No" - Whether this dataset is an intermediate output, as opposed to a final deliverable.
      "No" if this is final.
      This can inform how users interpret the dataset and its suitability for different use cases.

  pipeline_stage:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: >-
      Freetext position in processing pipeline.
      e.g., "post-detector, pre-reconstruction"
      e.g., "raw telemetry, pre-calibration"
  
  embargo_until:
    range: date
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Required if state=embargo. ISO 8601 date after which release is permitted.

  access_policy:
    range: AccessPolicyClass
    inlined: true
    in_subset:
      - accessibility_required
    description: >-
      Access Policy block:
      Describes who can access this dataset and under what conditions.
      access_policy.sensitivity_tier describes the dataset's access
      sensitivity — the same subject as security.sensitivity_tier above,
      reproduced here for access control systems that evaluate this block independently. 
      It will typically carry the same value as
      security.sensitivity_tier. Both are independent of datacard.sensitivity_tier. See NOTE ON SENSITIVITY TIERS above.
      Required for Genesis Dataset Readiness Model level 2 and above, and when release_status is published.

  access_level:
    range: AccessLevelEnum
    required: true
    in_subset:
      - accessibility_required
    description: >-
      The access level of the dataset, following AccessLevelEnum controlled vocabulary: open | controlled | restricted
      This provides important context about who can access the dataset and can inform users about potential barriers to access and use.
      This does not replace the authoritative source markings and metadata fields for classification, CUI, or other sensitivity designations, 
      which should still be filled out based on the authoritative source markings.

  access_restrictions:
    range: string
    required: false
    in_subset:
      - accessibility_if_applicable
    description: >-
      Freetext description of access restrictions.
      e.g., "Requires signed DUA" | "None - publicly accessible"
      | "Access limited to cleared personnel with need-to-know" | "Requires two-factor authentication and secure VPN access"
      Any specific access restrictions or requirements for the dataset, 
      beyond what is indicated by the classification and sensitivity markings.
      This can provide more detailed information about who is allowed to access the 
      dataset and under what conditions, which can inform users about potential barriers to access and use.

  authorization_required:
    range: AuthorizationRequiredEnum
    required: false
    multivalued: true
    in_subset:
      - accessibility_if_applicable
    description: >-
      List of authorizations required. When formal authorization is required to access the dataset, add terms from the
      following AuthorizationRequiredEnum controlled vocabulary 
      (e.g., "none", "account", "export_control_review", "user_agreement", "other").
  
  intended_partner_classes:
    range: IntendedPartnerClassEnum
    multivalued: true
    required: false
    in_subset:
      - accessibility_if_applicable
    description: >-
      The intended partner classes/types (list) that are expected to access and use this dataset, if applicable.
      Uses the IntendedPartnerClassEnum controlled vocabulary:
      internal_team
      tri_lab
      doe_nnsa_lab
      federal_partner
      contractor
      academic_researchers
      external_research_partner
      public
      industry_partners
      other
      This can provide insight into the target audience for the dataset and can inform users about the typical or intended user base.

  approved_environments:
    range: string
    multivalued: true
    required: false
    in_subset:
      - accessibility_if_applicable
    description: >-
      Approved environments for accessing or using the dataset, if applicable.
      e.g., "Secure Enclave A", "On-Premises HPC Cluster", "Cloud Environment B"
      And empty list ([]) if there are no specific approved environments or if the dataset is publicly accessible.
      null or absent means it has not yet been determined whether approved environments are required.
      This can inform users about where they are allowed to access and use the dataset, 
      which can be important for compliance with security requirements.

  policy_url:
    range: string
    pattern: '^https?://.+$|^not_applicable$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      URL to the official access policy or data use agreement governing this dataset.
      This can provide users with direct access to the full terms and conditions for using the dataset, which can inform their understanding of legal and ethical requirements.
  
  policy_text:
    range: string
    in_subset:
      - accessibility_if_applicable
    description: >-
      Inline summary if no policy_url exists.
      This can provide users with a quick overview of the key terms and conditions 
      for using the dataset, which can inform their understanding of legal and ethical requirements.

  license:
    range: LicenseClass
    inlined: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Block to capture a license under which the dataset is released.
      This indicates the legal permissions and restrictions associated with using the dataset and can inform users about how
      they are allowed to use, share, and build upon the data.
      A public/open license is not always the governing instrument for use,
      some controlled datasets may not have an SPDX-style reuse license at all,
      and use may instead be governed by contract, agreement, institutional review, or repository policy.
  
  spdx_id:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      The SPDX license identifier for the dataset, use the SPDX license identifier: https://spdx.org/licenses/
      e.g., CC-BY-4.0 | CC0-1.0 | Apache-2.0 | MIT (e.g., "SPDX-License-Identifier: CC-BY-4.0 
      Use "other" if not in SPDX registry. 
      Use "pending" if not yet assigned.
      This provides a standardized way to indicate the license for the dataset and can inform users about the legal permissions and restrictions associated with using the data.

  url:
    range: string
    pattern: '^https?://.+$'
    in_subset:
      - reusability_if_applicable
    description: >-
      URL to the official access policy or data use agreement governing this dataset.
      This can provide users with direct access to the full terms and conditions for using the dataset, which can inform their understanding of legal and ethical requirements.

  known_contractual_rights:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Any known contractual rights or obligations associated with this dataset 
      that may not be fully captured by the license or access policy information.
      This can include information about data sharing agreements, 
      third-party restrictions, or other legal considerations that users should be 
      aware of when working with the dataset.
      Important because DOE/NNSA datasets may have complex contractual arrangements that 
      impact how the data can be used and shared beyond license terms.

  additional_licenses:
    range: LicenseClass
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Additional licenses governing this dataset, if multiple licenses apply.
      This can provide users with a more complete understanding of the legal permissions and restrictions associated with using the dataset, especially in cases where different parts of the dataset may be subject to different licenses.

  dataset_publisher:
    range: PublisherClass
    inlined: true
    description: >-
      The publisher of the dataset, described by a name and ror_id if available.

      Required for datasets with release_status = approved | published
      This provides important provenance information about the dataset and can inform trust and maintenance practices.

  contact:
    range: ContactClass
    required: true
    inlined: true
    in_subset:
      - discoverability_required
    description: >-
      Contact information for questions about access to or use of this dataset.
      This can provide users with a direct point of contact for inquiries about the dataset, which can facilitate communication and support responsible use of the data.

  valid_until:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - discoverability_if_applicable
    description: >-
      Date after which this contact may no longer be valid., in ISO 8601 format (YYYY-MM-DD).
      Use for project-bound contacts (students, postdocs, term staff).
  
  succession_note:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: >-
      Who to contact if this contact is no longer reachable.
      e.g., "Contact the ORNL data management office at data@ornl.gov"
  
  additional_contacts:
    range: ContactClass
    multivalued: true
    inlined: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Additional contacts (e.g., instrument PI, data steward).
      Can include person or organization agent_types for the Contact.

  authors:
    range: AgentClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    list_elements_unique: true
    in_subset:
      - discoverability_required
    description: "At least one author required when release_status = approved | published."

  contributors:
    range: AgentClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: false
    list_elements_unique: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Supporting contributors who are not primary authors.
      e.g., sample preparers, annotators, reviewers, submitters.
      For draft or in-workflow data, populate with known contributors.
  
  sponsor_organizations:
    range: SponsorOrganizationClass
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - discoverability_required
    description: "Organizations that funded or sponsored this dataset."

  award_number:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: "Award number(s) associated with the funding for this dataset. E.g., DE-AC05-00OR22725"

  funding_source:
    range: FundingSourceEnum
    in_subset:
      - discoverability_if_applicable
    description: >-
      Funder or sponsor of the research that produced this dataset.
      From controlled vocabulary FundingSourceEnum
      doe_program_sc
      doe_program_nnsa
      ldrd
      wfo
      crada
      other_federal
      state_government
      subcontract
      industry
      nonprofit
      internal
      other

  program:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: "The program or initiative under which this dataset was created. E.g., 'Advanced Scientific Computing Research'"

  sponsoring_doe_program_office:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: "The DOE program office that sponsored or funded the research that produced this dataset. E.g., 'Office of Science' or 'National Nuclear Security Administration'"

  sponsoring_doe_subprogram:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: "The DOE subprogram that sponsored or funded the research that produced this dataset. E.g., 'Advanced Scientific Computing Research' or 'Predictive Science Academic Alliance Program'"

  research_organizations:
    range: ResearchOrganizationClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: true
    in_subset:
      - discoverability_required
    description: "Organizations that created or collected the data."
  
  facilities:
    range: FacilityClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      User facilities, HPC centers, or research infrastructure
      used to collect, process, or store the dataset.
  
  facility:
    range: FacilityClass
    description: "A user facility, HPC center, or research infrastructure used to collect, process, or store the dataset."

  location:
    range: LocationClass
    in_subset:
      - discoverability_if_applicable
    description: >-
      Point location for facility-based experimental data, if applicable.
      description: should include the place name and, location details
      e.g., "SNS Beamline 1B, Oak Ridge National Laboratory, TN, USA"
  
  science_domain:
    range: ScienceDomainEnum
    in_subset:
      - discoverability_if_applicable
    description: >-
      Scientific domain or discipline this dataset primarily relates to.
      Extends the the list of OSTI Subject Areas with an Other category for datasets that do not fit into the OSTI list.
      Controlled vocabulary:
      Biology and Medicine | Chemistry | Energy Storage, Conversion, and Utilization | Engineering | Environmental Sciences | Fission and Nuclear Technologies | Fossil Fuels | Geosciences | Materials | Mathematics and Computing | National Defense | Physics | Power Generation and Distribution | Renewable Energy
  
  tags:
    range: TagsClass
    in_subset:
      - discoverability_if_applicable
    description: >-
      Structured tags block for catalog filtering and discovery, including project, science, object_type, and risk.
  
  science:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: >-
      More specific scientific domain, sub-discipline, or topic.
      e.g., "lightsource" | "fusion" | "materials" | "biology" | "synchrotron light source science" | "magnetic confinement fusion" | "materials under extreme conditions"

  task_category:
    range: string
    required: false
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    aliases:
        - task
        - ml_task
    in_subset:
      - discoverability_if_applicable
    description: >-
      Primary task category or categories for this dataset.
      Helps ML practitioners find
      relevant datasets in the catalog. e.g., 
      classification | regression | segmentation | detection | generation | translation |
      summarization | ranking | anomaly_detection |
      clustering | reinforcement_learning | other

  task_subcategory:
    range: string
    required: false
    multivalued: true
    inlined_as_list: true
    aliases:
        - task_sub
        - ml_task_sub
        - ml_sub_task
    in_subset:
      - discoverability_if_applicable
    description: >-
      More specifictask subcategory or subcategories. e.g., 
      binary_classification | multi_class_classification | multi_label_classification |
      image_segmentation | object_detection | time_series_forecasting |
      named_entity_recognition | question_answering | other
  
  data_structure:
    range: DataStructureClass
    inlined: true
    required: false
    in_subset:
      - interoperability_required
    description: "Placeholder for additional dataset characteristics metadata."
  
  formats:
    range: string
    multivalued: true
    in_subset:
      - interoperability_required
    description: >-
      File formats included in this dataset. e.g., 
      csv | json | parquet | hdf5 | netcdf |
      image formats (jpeg, png, tiff) | audio formats (wav, mp3) |
      video formats (mp4, avi) | other

  encoding:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Character encoding for text-based formats.
      e.g., UTF-8 | ASCII | Latin-1

      UTF-8 strongly recommended. Use not_applicable for binary formats.
  
  schema_version:
    range: string
    pattern: '^\d+\.\d+(\.\d+)?$|^not_applicable$'
    in_subset:
      - interoperability_if_applicable
    description: >-
      Version of the data schema used in this dataset.
      
      Distinct from datacard_version. Increment when field names,
      types, or structure change between dataset versions.
  
  modalities:
    range: string
    required: true
    multivalued: true
    inlined_as_list: true
    in_subset:
      - interoperability_required
    description: >-
      Data modalities present.
      e.g.,
      "tabular",
      "image",
      "time-series",
      "text",
      "graph",
      "point-cloud"

  features:
    range: FeatureClass
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_required
    description: >-
      Primary variables, fields, or features.
      IMPORTANT: choose ONE form and use it consistently — do not mix.
      For basic discoverability — flat string list: e.g., 
        name: temperature
        name: pressure
        name: timestamp
        name: label
      To enhance interoperability, reuse, and AI-readiness (replace flat list above):
        name: temperature
          description: Sample temperature at time of measurement
          data_type: float           # float | int | string | boolean | datetime | other
          unit: Kelvin
          range: "273.15 - 373.15"
  
  feature:
    range: FeatureClass
    description: >-
      A block for capturing information about the dataset's features, variables, or fields.
      A primary variable, field, or feature in the dataset.
      Can be represented as a simple string for core/extended profiles 
        temperature
      or as a structured block for AI agent use profile.
        temperature
          description: Sample temperature at time of measurement
          data_type: float           # float | int | string | boolean | datetime | other
          unit: Kelvin
          range: "273.15 - 373.15"
  
  unit:
    range: string
    in_subset:
      - interoperability_if_applicable
    broad_mappings:
      - schema:unitText
    description: >-
      The unit of measurement for a feature, if applicable.

      This can provide important context for interpreting the values of the feature and can inform users about how to work with the data effectively.

  data_type:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      The data type of a feature or variable, following a controlled vocabulary from  (e.g., float, int, string, boolean, datetime, other).
      This can provide important information about the nature of the data and can inform users about how to interpret and work with the dataset.
    broad_mappings:
      - schema:dataType

  splits:
    range: string
    multivalued: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Dataset splits if pre-divided.
      Information about training, validation, and test splits for AI/ML datasets.
      
      Example values: train, test, validation.
      
      This can provide important context for how the dataset is structured for machine learning tasks and can inform users about how to use the data effectively for model training and evaluation.

  range:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      The range of values for a feature, if applicable.
     
      This can provide important information about the expected values for a feature 
      and can inform users about how to work with the data effectively.

  spatial_coverage:
    range: SpatialCoverageClass
    required: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      Spatial coverage block for geospatial datasets, if applicable.
      
      This can include a description and slots for the bounding box coordinates.
      such as bounding boxes, place names, or other location-based metadata that can inform users 
      about the spatial context of the data.

  geo_location_box:
    range: GeoLocationBoxClass
    in_subset:
      - interoperability_if_applicable
    description: >-
      Geographic bounding box for geospatial datasets, if applicable.
      
      Container for elements describing the west_bound_longitude, east_bound_longitude, south_bound_latitude, and north_bound_latitude in decimal degrees.
      
      e.g., west_bound_longitude=-125.0, east_bound_longitude=-66.5, south_bound_latitude=24.0, north_bound_latitude=49.0 for continental US
    exact_mappings:
      - datacite:geoLocationBox
    broad_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  west_bound_longitude:
    range: float
    in_subset:
      - interoperability_if_applicable
    description: "Westernmost longitude in decimal degrees for geospatial datasets."
    exact_mappings:
      - datacite:westBoundLongitude
    broad_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  east_bound_longitude:
    range: float
    in_subset:
      - interoperability_if_applicable
    description: "Easternmost longitude in decimal degrees for geospatial datasets."
    exact_mappings:
      - datacite:eastBoundLongitude
    broad_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  south_bound_latitude:
    range: float
    in_subset:
      - interoperability_if_applicable
    description: "Southernmost latitude in decimal degrees for geospatial datasets."
    exact_mappings:
      - datacite:southBoundLatitude
    broad_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  north_bound_latitude:
    range: float
    in_subset:
      - interoperability_if_applicable
    description: "Northernmost latitude in decimal degrees for geospatial datasets."
    exact_mappings:
      - datacite:northBoundLatitude
    broad_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  temporal_coverage:
    range: TemporalCoverageClass
    required: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      Temporal coverage for time-based datasets, if applicable.
      
      Container for elements describing the start_date and end_date of the dataset's temporal coverage in ISO 8601 format (YYYY-MM-DD).
      e.g., start_date=2020-01-01, end_date=2020-12-31 for a dataset covering the year 2020.
    broad_mappings:
      - schema:temporalCoverage
      - dcterms:temporal
      - schema:date
      - dcterms:date
      - dcterms:coverage
      - datacite:dateType
  
  start_date:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - interoperability_if_applicable
    description: "Start date of the dataset's temporal coverage in ISO 8601 format (YYYY-MM-DD)."
    broad_mappings:
      - schema:temporalCoverage
      - dcterms:temporal
      - schema:date
      - dcterms:date
      - dcterms:coverage
      - datacite:dateType

  end_date:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - interoperability_if_applicable
    description: "End date of the dataset's temporal coverage in ISO 8601 format (YYYY-MM-DD)."
    broad_mappings:
      - schema:temporalCoverage
      - dcterms:temporal
      - datacite:coverage

  dataset_scale:
    range: DatasetScaleClass
    inlined: true
    required: false
    in_subset:
      - accessibility_if_applicable
    description: >-
      A block to describe the scale of the dataset, records (and units), bytes (compressed and uncompressed).
      
      This can provide important information about the size and scope of the dataset, which can inform users about the computational resources that may be required to work with it effectively.
    broad_mappings:
      - schema:size
      - dcterms:extent
      - datacite:size

  record_count:
    range: integer
    in_subset:
      - accessibility_if_applicable
    description: "The number of records or rows in the dataset, if applicable."
    broad_mappings:
      - schema:size
      - dcterms:extent
      - datacite:size
  
  record_unit:
    range: string
    in_subset:
      - accessibility_if_applicable
    description: "The unit of measurement for the record count (e.g., samples, files, records, timesteps, images, tokens, other)."

  compressed_bytes:
    range: integer
    in_subset:
      - accessibility_if_applicable
    description: "The size of the dataset in bytes when compressed, if applicable."
    broad_mappings:
      - schema:size
      - dcterms:extent
      - datacite:size

  uncompressed_bytes:
    range: integer
    in_subset:
      - accessibility_if_applicable
    description: "The size of the dataset in bytes when uncompressed, if applicable."
    broad_mappings:
      - schema:size
      - dcterms:extent
      - datacite:size

  dates:
    range: DatesClass
    inlined: true
    required: false
    in_subset:
      - interoperability_if_applicable
    description: "Class slot for important dataset dates metadata (e.g., collection, issued, modified dates)."
    broad_mappings:
      - schema:ItemList

  data_collection_start:
    range: date
    in_subset:
      - interoperability_if_applicable
    description: "The date when data collection for this dataset started, in ISO 8601 format (YYYY-MM-DD)."
    broad_mappings:
      - schema:date
      - dcterms:date
      - dcterms:coverage
      - datacite:dateType

  data_collection_end:
    range: date
    in_subset:
      - interoperability_if_applicable
    description: "The date when data collection for this dataset ended, in ISO 8601 format (YYYY-MM-DD)."
    broad_mappings:
      - schema:date
      - dcterms:date
      - dcterms:coverage
      - datacite:dateType

  issued:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - interoperability_if_applicable
    description: "The ISO 8601 (YYYY-MM-DD) date the dataset was first publicly released."
    exact_mappings:
      - schema:datePublished
    broad_mappings:
      - dcterms:issued
      - datacite:dateType

  modified:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - interoperability_if_applicable
    description: "The ISO 8601 (YYYY-MM-DD) date the dataset was most recently modified."
    exact_mappings:
      - schema:dateModified
    broad_mappings:
      - dcterms:modified
      - datacite:dateType

  access:
    range: AccessClass
    inlined: true
    in_subset:
      - accessibility_required
    description: >-
      Access Endpoints information. 
      This can include the current location/landingpage, and intended repository information, such as access instructions and APIs.
      Intended to provide information on how to access the dataset for humans and machines.

  current_location:
    range: string
    required: true
    in_subset:
      - accessibility_required
    description: >-
      Where the data physically resides right now.
      Use for in-workflow data not yet deposited in a repository, or for any dataset with a known internal or external storage path.
      
      e.g., /mnt/ecs/scientific-data/project/dataset/
      
      e.g., /lustre/orion/proj-shared/dataset/
      
      e.g., s3://genesis-bucket/dataset/
  
  publicly_facing_landing_page_url:
    range: string
    pattern: '^https?://.+$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      A publicly facing URL that provides information about the dataset and how to access it, if available.

      It may differ from the current_location if the dataset is not yet publicly released or if the current_location is an internal storage path.
      
      This can provide users with a direct point of access for learning more about the dataset and how to obtain it, which can facilitate discovery and use of the data.

  intended_repositories:
    range: IntendedRepositoryClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - accessibility_if_applicable
    description: >-
      Repositories you intend to deposit or have deposited this dataset in. 
      
      The managing repository or catalog system will
      resolve and populate repository-assigned fields at ingest (see repository_managed slot). 
      
      Repositories may be institutional, project-owned, community, or national 
      (e.g., OSTI, Zenodo, institutional data repository, project data store).
  
  is_primary:
    range: YesNoEnum
    in_subset:
      - accessibility_if_applicable
    description: >-
      "Yes" | "No" - Whether this is the primary or authoritative location for the dataset.
      Only one IntendedRepository should be marked as primary. 
      
      This can help users identify the most reliable or official source for accessing the dataset, 
      especially if there are multiple access points or repositories where the data is available.

  date_deposited:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      The date when the dataset was deposited in the repository, in ISO 8601 format (YYYY-MM-DD).
      
      This can provide temporal context for when the dataset became available in the repository 
      and can inform users about the currency of the data.
  
  data_services:
    range: DataServiceClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: false
    in_subset:
      - accessibility_if_applicable
    exact_mappings:
      - dcterms:DataService
    description: >-
      APIs available for accessing the dataset, if any.
      This can provide users with information about programmatic access options for the dataset, which can facilitate integration into AI/ML workflows and other data processing pipelines.

  endpoint:
    range: string
    pattern: '^https?://.+$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      The URL or connection string for an API endpoint that provides access to the dataset.
      
      This can provide users with direct access to programmatic interfaces for working with the dataset, 
      which can facilitate integration into AI/ML workflows and other data processing pipelines.
      
      Useful for enabling machine-actionable data documentation.
    exact_mappings:
      - schema:WebAPI
  
  documentation_url:
    range: string
    pattern: '^https?://.+$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      URL to documentation for the API or access method.
      
      This can provide users with important information about how to use the API or access method effectively, 
      which can facilitate integration into AI/ML workflows and other data processing pipelines.
      
      Useful for enabling machine-actionable data documentation.

  authentication:
    range: AuthenticationTypeEnum
    in_subset:
      - accessibility_if_applicable
    description: >-
      Whether authentication is required to access the dataset through this endpoint.
      This can inform users about potential barriers to access and can help them prepare for any necessary credentials or permissions needed to work with the dataset.
  
  rate_limit:
    range: string
    in_subset:
      - accessibility_if_applicable
    description: >-
      Any rate limits or access restrictions for the API endpoint. e.g., 
      "1000 requests/hour", 
      "5000 requests/day", 
      "1000 requests/hour and no more than 100 concurrent connections"

      This can inform users about potential limitations on how frequently they can access the dataset 
      through the API, which can help them plan their data processing and analysis workflows accordingly.
  
  provenance:
    range: ProvenanceClass
    required: true
    inlined: true
    in_subset:
      - interoperability_required
    description: >-
      Provenance information about the dataset, including its origin, history, 
      and any transformations/processing it has undergone.
      
      This can provide important context for understanding the dataset and can inform users 
      about its reliability and suitability for their intended use and facilitate reuse and reproducibility.
  
  was_generated_by:
    range: string
    required: true
    in_subset:
      - interoperability_required
    description: >-
      High-level description of the generating process.
      Even a one-line answer dramatically improves catalog value.
      
      e.g., "Neutron scattering experiment at SNS Beamline 1B"
      
      e.g., "Monte Carlo simulation using MCNP 6.2"
      
      e.g., "Derived from raw telemetry via calibration pipeline v2.1"
  
  source_data:
    range: SourceDatasetClass
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Source datasets this dataset was derived from. 
      
      Uses the SourceDatasetClass block to capture the relationship and provenance information 
      about the source datasets.

  relationship:
    range: RelationshipTypeEnum
    in_subset:
      - interoperability_if_applicable
    description: >-
      Relationship to other datasets or resources, if any.
      
      E.g.s, "is_derived_from", "is_based_on", "is_part_of", "has_part", "references", "other"
      
      This can include links to related datasets, publications, software, or other resources that are relevant to understanding and using the dataset effectively.

  processing_steps:
    range: string
    required: true
    multivalued: false
    in_subset:
      - interoperability_required
    description: >-
      Key processing, cleaning, calibration, or transformation steps applied to produce this dataset.
      
      Describe any processing steps, transformations, or cleaning that have been applied to the dataset.
      
      This can provide important context for understanding the dataset and can inform users 
      about its reliability and suitability for their intended use.
  
  instrumentation:
    range: string
    multivalued: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      Instruments, sensors, detectors, or equipment used to collect the data, if applicable.
      Include make, model, and version where relevant.
      e.g., "Neutron scattering experiment using a He-3 position-sensitive detector at SNS Beamline 1B"
      e.g., "Data collected using a Tektronix TDS2024C oscilloscope"
      e.g., "Satellite remote sensing data from the MODIS instrument on the Terra satellite"
      This can provide important context for understanding the dataset and can inform users 
      about its reliability and suitability for their intended use.

  simulation_details:
    range: string
    multivalued: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      For simulation-derived data: code, simulation setup, version, key parameters, and configuration for simulated datasets, if applicable.
      
      e.g., "Monte Carlo simulation using MCNP 6.2 with a 10x10x10 grid, 1 million particles, and physics models X, Y, Z"
      
      e.g., "Molecular dynamics simulation using LAMMPS version 3Mar2020 with the following input script: ..."
      
      e.g., "Climate model simulation using the Community Earth System Model (CESM) version 2.1 with the following configuration: ..."
      
      This can provide important context for understanding the dataset and can inform users about its reliability and suitability for their intended use.
  
  software_environment:
    range: SoftwareEnvironmentClass
    in_subset:
      - interoperability_if_applicable
    description: >-
      Software environment block used to generate or process this dataset, 
      using SoftwareEnvironmentClass to capture details about os, container, and hpc environment.
      
      Captures what is needed for computational reproducibility , including software environment details 
      for datasets that are generated or processed using specific software tools, if applicable.
      
      This can provide important context for understanding the dataset and can inform users 
      about its reliability and suitability for their intended use.

  os:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Operating system used in the software environment for generating or processing this dataset, if applicable.
      
      e.g., "RHEL 8.6" | "Ubuntu 22.04"
  
  compiler:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Compiler used in the software environment for generating or processing this dataset, if applicable.
      
      e.g., "GCC 11.3.0" | "Intel oneAPI 2023.1" | "Clang 14.0.6"
  
  container:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Containerization technology used in the software environment 
      for generating or processing this dataset, if applicable.
      
      e.g., docker://registry/image:tag | singularity://registry/image:tag | "Docker 20.10.12" | "Singularity 3.8.7"

  hpc_environment:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      HPC environment or platform used in the software environment for generating or processing this dataset, if applicable.
      
      e.g., "module load python/3.10 cuda/11.8 openmpi/4.1"
      
      e.g., "Orion HPC at Oak Ridge National Laboratory sourcing the following environment modules..."
      
      e.g., "Summit HPC at Oak Ridge National Laboratory sourcing the following environment modules..."

  notes:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Additional environment details, key library versions, or reference to a full environment manifest.
      
      e.g., "See requirements.txt in dataset root"
      
      e.g., "numpy 1.24, pytorch 2.0.1, h5py 3.8.0"

  stewardship:
    range: StewardshipClass
    inlined: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Stewardship & Versioning Block to capture information about dataset maintenance, updates, versioning, and reviews.
      
      This can provide users with important information about how the dataset is maintained and updated over time,
      which can inform their confidence in the dataset's quality and reliability and can help them understand how the dataset evolves over time.
      
      NOTE ON VERSIONING: Three fields work together to describe versioning:
      
      discoverability.identification.version        — the version number of this dataset
      
      discoverability.identification.supersedes /
      
      discoverability.identification.superseded_by  — links to prior and successor versions
      
      reusability.stewardship.versioning_strategy — how versioning is managed over time

  level:
    range: StewardshipLevelEnum
    in_subset:
      - reusability_if_applicable
    description: >-
      The level of stewardship for this dataset, following a controlled vocabulary:
      project_managed | repository_managed | externally_managed

  maintainer:
    range: AgentClass
    inlined: true
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Person or organization responsible for ongoing maintenance of the dataset over time, if different from the contact.
      
      This can provide users with a point of contact for ongoing maintenance and updates to the dataset, 
      which can facilitate communication and support responsible use of the data.
  
  update_frequency:
    range: UpdateFrequencyEnum
    in_subset:
      - reusability_if_applicable
    description: >-
      How often the dataset is updated or expected to be updated, if applicable.
      
      Controlled vocab includes "none", "ad_hoc", "monthly", "quarterly", "annually", "continuously", "other"
      
      This can inform users about the currency of the dataset and can help them plan for when new data may become available.
  
  retention_policy:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Information about the dataset's retention policy, including how long the dataset will be retained 
      and any conditions for its removal or archiving.
      
      e.g., "Retained for 10 years per DOE data management policy"
      
      This can provide users with important information about the longevity of the dataset 
      and can inform their decisions about using and citing the data.

  versioning_strategy:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Information about the dataset's versioning strategy, including how new versions are created and managed over time.
      
      e.g., "New version created for each major update; minor updates appended to existing version with date suffix"
      
      e.g., "Semantic versioning; all versions retained in Zenodo"
      
      e.g., "Major versions only; prior versions available on request"
      
      NOTE ON VERSIONING: Three fields work together to describe versioning:
      
      discoverability.identification.version        — the version number of this dataset
      
      discoverability.identification.supersedes /
      
      discoverability.identification.superseded_by  — links to prior and successor versions
      
      reusability.stewardship.versioning_strategy — how versioning is managed over time
      
      This can provide users with important information about how the dataset evolves over time 
      and can inform their decisions about which version to use and how to cite the data.

  review_provenance_companion:
    range: SpecificReviewClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Reviews or assessments of the dataset, if any.
      Running history of all formal reviews. Add one entry per review stage in chronological order. Do not overwrite
      earlier entries when adding new ones.

      This block extends the Genesis Sensitivity V2 review_provenance_companion (which only accepts a single review) by allowing multiple review records to be captured in a structured format, 
      which is especially useful for datasets that have undergone multiple reviews or have complex provenance histories.
      
      This can provide users with insights into the quality and reliability of the dataset 
      based on expert evaluations or user feedback, which can inform their decisions about using the data.

  source_review_reference:
    identifier: true
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Identifier or citation for the authoritative review/release/source document.
  
  review_purpose:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      The purpose or focus of the review, such as export control, IRB, security, quality assessment, or other.
      
      This can provide users with important context about the nature of the review and what aspects of the dataset were evaluated, 
      which can inform their understanding of the dataset's quality and reliability.
      
      e.g., "Export control review prior to public release"

  source_review_authority:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Office, system, or authority of record for the source sensitivity determination.
      
      This can provide users with information about the official authority responsible for the review, 
      which can inform their confidence in the dataset's quality and reliability.
      
      e.g., "DOE Office of Export Control" | "Institutional Review Board at XYZ University" | "Internal security review board"

  review_contact_name:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Human point of contact, if appropriate to capture.
      
      This can provide users with a point of contact for questions about the review process and its outcomes, 
      which can facilitate communication and support responsible use of the data.

  review_contact_email:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Contact email, if appropriate to capture.
      
      This can provide users with a point of contact for questions about the review process and its outcomes, 
      which can facilitate communication and support responsible use of the data.
  
  reviewed_by:
    range: AgentClass
    inlined: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Person or role responsible for conducting the review, if applicable.
      
      This can provide users with information about the expertise and credibility of the reviewers, 
      which can inform their confidence in the dataset's quality and reliability.

  decontrol_or_declassify_on:
    range: string
    pattern: '^(\d{4}-\d{2}-\d{2}|not_applicable)$'
    in_subset:
      - governed_use_if_applicable
    description: >-
      For sensitive datasets, the date when the dataset can be decontrolled or declassified, if applicable.
      
      This can provide users with information about when the dataset may become more widely available and can inform their decisions about using and citing the data.

  review_date:
    range: string
    pattern: '^(\d{4}-\d{2}-\d{2}|not_applicable)$'
    in_subset:
      - governed_use_if_applicable
    description: >-
      The date when the review was conducted or completed, in ISO 8601 format (YYYY-MM-DD).
      This can provide users with temporal context for when the review took place, which can inform their understanding of the dataset's quality and reliability at that point in time.

  comments:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Additional comments or notes about the review, if any.
      
      This can provide users with additional context and insights about the review process and its outcomes, 
      which can inform their understanding of the dataset's quality and reliability.
  
  related_resources:
    range: RelatedResourcesClass
    inlined: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Related Resources:
      Links to related datasets, publications, software, and AI models. 
      
      The base relationship vocabulary for relations (RelationshipTypeEnum) is shared across all resource types; 
      is_derived_from | is_based_on | is_part_of | has_part | references | other
      
      ExtendedRelationshipEnum (software and AI models):
      used_to_create | used_to_process | used_to_analyze | trained_on | evaluated_on

  datasets:
    range: DatasetClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Related datasets, if any. 
      
      This can include links to other datasets that are relevant to understanding and using the dataset effectively, 
      such as source datasets, derived datasets, or complementary datasets.

  publications:
    range: PublicationIdentifierClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Publications associated with this dataset, if any. 
      
      This can include links to scholarly articles, conference papers, or other publications that describe the dataset or its use, 
      which can provide users with additional context and insights about the dataset.

  identifiers:
    range: PublicationIdentifierClass
    multivalued: true
    inlined: true
    inlined_as_list: true

  software:
    range: SoftwareClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Software associated with this dataset, if any. 
      
      This can include links to software tools, libraries, or frameworks that were used to generate, process, or analyze the dataset, 
      which can provide users with additional context and insights about the dataset.

  ai_models:
    range: AIModelClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      AI models associated with this dataset, if any. 
      
      This can include links to AI models that were trained on, evaluated using, or otherwise related to the dataset, 
      which can provide users with additional context and insights about the dataset.
  
  domain_metadata:
    range: DomainMetadataClass
    inlined: true
    inlined_as_list: true
    required: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      A block for capturing domain-specific metadata that may be relevant for understanding and using the dataset effectively.
      
      This can include fields that are specific to certain scientific domains or types of data, 
      which can provide users with important context and insights about the dataset.
      
      Domain-specific metadata fields supplement the Discoverable card 
      and should not replace the common metadata expected by the datacard.

  schema_reference:
    range: SchemaReferenceClass
    in_subset:
      - interoperability_if_applicable
    description: >-
      Reference to a schema or controlled vocabulary that defines the domain-specific metadata fields used in the domain_metadata block.
      
      This can provide users with information about the structure and semantics of the domain-specific metadata, 
      which can inform their understanding of the dataset and how to work with the domain-specific metadata

  fields:
    description: Field names, their corresponding values, data types, units, and descriptions for domain-specific metadata.
    range: DomainMetadataFieldValueClass
    multivalued: true
    inlined: true
    inlined_as_list: false
  
  field_value:
    description: The value for a specific domain metadata field.
    range: string
    in_subset:
      - interoperability_if_applicable
  
  non_sensitivity_governance_metadata:
    range: NonSensitivityGovMetadataClass
    required: false
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Governance-relevant metadata that may affect sharing/use decisions but is not part of the source sensitivity/marking block itself.
      
      This can include information about any governance considerations or requirements that are relevant to the dataset, 
      which can inform users about responsible use and any potential limitations or restrictions on the dataset.
      
      Includes fields for export control, privacy, and data rights.

  export_control:
    range: ExportControlClass
    required: true
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Includes fields related to export control considerations for the dataset, if applicable.
      
      This can provide users with important information about any export control restrictions or requirements that may apply to the dataset, 
      which can inform their decisions about using and sharing the data responsibly.

  export_control_status:
    range: YesNoPendingUnknownEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      The export control status of the dataset, following a controlled vocabulary: 
      "Yes" | "No" | "pending_review" | "unknown"
  
  export_control_basis:
    range: ExportControlBasisEnum
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      The basis for the export control status, if applicable, following a controlled vocabulary:
      ITAR | EAR | DOE_Nuclear_Export_Control | Other | not_applicable

  foreign_national_access_status:
    range: ForeignNationalAccessStatusEnum
    required: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Governance-facing outcome field indicating whether foreign national access
      is allowed, restricted, prohibited, or conditional, based on the combined
      effect of applicable export, classification, dissemination, agreement,
      or other source-authoritative constraints. This is not an export-only field.
      
      Controlled vocabulary:
      Allowed | Restricted | Prohibited | Conditional | Unknown
  
  privacy:
    range: PrivacyClass
    required: true
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Includes fields related to privacy considerations for the dataset, if applicable.
      
      This can provide users with important information about any privacy restrictions or requirements that may apply to the dataset, 
      which can inform their decisions about using and sharing the data responsibly.

  privacy_status:
    range: YesNoPendingUnknownEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      The privacy status of the dataset, following a controlled vocabulary (use quotes to distinguish from boolean values):
      "Yes" | "No" | "Pending_Review" | "Unknown"
  
  pii_status:
    range: YesNoPendingUnknownEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      Whether the dataset contains personally identifiable information (PII), following a controlled vocabulary (use quotes to distinguish from boolean values): 
      "Yes" | "No" | "Pending_Review" | "Unknown"
  

  phi_status:
    range: YesNoPendingUnknownEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      Whether the dataset contains protected health information (PHI), following a controlled vocabulary (use quotes to distinguish from boolean values): 
      "Yes" | "No" | "Pending_Review" | "Unknown"

  privacy_control_basis:
    range: PrivacyControlBasisEnum
    multivalued: true
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      The basis for the privacy status, if applicable.
     
      List all that apply from the following controlled vocabulary:
      HIPPA | Privacy_Act | Human_Subjects | Other_Regulated_Privacy | Site_Specific | not_applicable
  
  privacy_regime_notes:
    range: string
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      Optional notes for privacy regimes or handling nuances not captured by controlled values.
      
      This can provide users with important context about the privacy considerations and requirements that may apply to the dataset, 
      which can inform their decisions about using and sharing the data responsibly.

  rights_release_records:
    range: RightsReleaseRecordsClass
    required: true
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Information about rights release records for the dataset, if applicable.
      
      This can provide users with important information about any rights or permissions associated with the dataset, 
      which can inform their decisions about using and sharing the data responsibly.

  ip_restriction_type:
    range: IPRestrictionTypeEnum
    in_subset:
      - governed_use_if_applicable
    description: >-
      The type of intellectual property (IP) restriction that applies to the dataset, if any. 
      
      Select one from the following controlled vocabulary:
      Proprietary | Limited_Rights | Restricted_Rights | Government_Purpose_Rights | Unlimited_Rights | Third_Party_Licensed | None

  agreement_required:
    range: YesNoEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      "Yes" | "No" - Whether an agreement (e.g., data use agreement, license agreement, nondisclosure agreement) is required to access or use the dataset.

  agreement_type:
    range: AgreementTypeEnum
    required: false
    minimum_cardinality: 1
    in_subset:
      - governed_use_if_applicable
    description: >-
      The type of agreement required to access or use the dataset, if applicable, following a controlled vocabulary:
      DUA | CRADA | MOU | NDA | LICENSE | WFO | OTHER

  public_release_status:
    range: PublicReleaseStatusEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      The public release status of the dataset. 
      Select one from the following controlled vocabulary:
      "Approved" | "Pending" | "Not_Approved" | "Requires_STI_Review"
  
  record_status:
    range: RecordStatusEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      The record status of the dataset. 
      
      Select one from the following controlled vocabulary:
      federal_record | contractor_record | non_record | mixed | unknown

  compliance:
    range: ComplianceClass
    inlined: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Populate when release_status = under_review | approved | published.
      
      Acts as a holder for confirmation of compliance with relevant policies, standards, and requirements for the dataset.
      
      This can provide users with important information about the dataset's adherence to relevant policies and standards, 
      which can inform their confidence in the dataset's quality and reliability.

  doe_data_management_plan:
    range: YesNoUnknownNotApplicableEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      "Yes"|"No"|"Unknown"|"not_applicable" — Whether the dataset is in compliance with a DOE Data Management Plan (DMP), if applicable.
      
      This can provide users with information about the dataset's data management practices and can inform their confidence in the dataset's quality and reliability.
  
  osti_elink2_metadata_compliant:
    range: YesNoUnknownNotApplicableEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      "Yes"|"No"|"Unknown"|"not_applicable" — Whether the dataset is compliant with OSTI's E-Link 2.0 metadata requirements, if applicable.
      
      This can provide users with information about the dataset's adherence to OSTI's metadata standards, 
      which can inform their confidence in the dataset's quality and reliability.

  irb_approved:
    range: YesNoUnknownNotApplicableEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      "Yes"|"No"|"Unknown"|"not_applicable" — Whether the dataset has been approved by an Institutional Review Board (IRB), if applicable.
      
      This can provide users with information about the ethical considerations and protections associated with the dataset, 
      which can inform their confidence in the dataset's quality and reliability.

  citation:
    range: CitationClass
    inlined: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Citation information for the dataset, if applicable.
      Required when release_status = approved | published.
      
      This can provide users with the necessary information to properly cite 
      the dataset in their work, which can facilitate proper attribution and recognition 
      for the creators and maintainers of the dataset.

  report_number:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Report number or other unique identifier for the dataset, if applicable.
      
      e.g., SAND2024-XXXXX | LAUR-XX-XXXXX | ORNL/TM-2024/XXXXX
      
      This can provide users with an additional identifier for the dataset that can be used 
      in citations and references.

  preferred_citation:
    range: PreferredCitationClass
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Fields that can be used to create full recommended citation in bibtex format for the dataset, if applicable.

      The fields author, title, year, publisher are required if preferred_citation is provided.

      At least one of doi or url must be provided if preferred_citation is provided.

      This can provide users with a recommended citation format for the dataset, 
      which can facilitate proper attribution and recognition for the creators and maintainers of the dataset.
  
  author:
    range: string
    required: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Author(s) of the dataset, if applicable. 
      author: is intended as a component of a bibtex citation when preferred_citation is provided.

      Required when a preferred_citation is provided.

      This can provide users with information about the creators of the dataset, 
      which can inform their confidence in the dataset's quality and reliability.

  title:
    range: string
    required: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Title of the dataset, if applicable.
      title: is intended as a component of a bibtex citation when preferred_citation is provided.

      Required when a preferred_citation is provided.

      This can provide users with information about the dataset and can inform their understanding of its content and focus.
      
  year:
    range: string
    pattern: '^\d{4}$'
    required: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Year of publication or release of the dataset, if applicable.
      year: is intended as a component of a bibtex citation when preferred_citation is provided

      Required when a preferred_citation is provided.

      This can provide users with temporal context for the dataset, which can inform their understanding of its relevance and currency.

  howpublished:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      How the dataset was published or released, if applicable (e.g., "Online", "In Repository", "As Supplementary Material").
      how_published: is intended as a component of a bibtex citation when preferred_citation is provided

      This can provide users with information about how the dataset was made available, 
      which can inform their understanding of its accessibility and potential use cases.

  publisher:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Publisher or distributing organization for the dataset, if applicable.
      publisher: is intended as a component of a bibtex citation when preferred_citation is provided

      Required when a preferred_citation is provided.

      This can provide users with information about the organization responsible for distributing the dataset,
  
  doi:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Digital Object Identifier (DOI) for the dataset, if applicable.
      doi: is intended as a component of a bibtex citation when preferred_citation is provided

      Required when a preferred_citation is provided.

      This can provide users with a persistent identifier for the dataset that can be used in citations and references.

  eprinttype:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      The type of eprint identifier provided in the url field, if applicable (e.g., arXiv, report_number, pubmed).
      eprinttype: is intended as a component of a bibtex citation when preferred_citation is provided.
      
  eprint:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      The eprint identifier for the dataset, if applicable (e.g., 1234.56789, SAND2024-XXXXX).
      Value with correspond to the format of the eprinttype provided (e.g., arXiv, report_number, pubmed).
      eprint: is intended as a component of a bibtex citation when preferred_citation is provided.
      
      This can provide users with an additional identifier for the dataset that can be used in citations and references.

  note:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Additional notes related to the preferred citation, if any.
      Is intended to align with bibtex "note" field when preferred_citation is provided.
      For legacy bibtex entries that don't accept eprinttype and eprint and
      that need to support an ark or other identifiers that don't fit cleanly into the existing fields, the note field can be used to capture this information in a free-text format.
      include a note: field use this format for the note field: note: Available at ark:/12345/abcde
      
      This can provide users with additional context and information about the preferred citation for the dataset.

  ai_usage:
    range: AIUsageClass
    inlined: true
    in_subset:
      - ai_usability_required
    description: >-
      Describes whether and how this dataset may be used in AI/ML workflows using
      fields from AIUsageClass. 
      
      Be explicit — these fields are read by automated pipeline tooling.
      
      This can provide important information about the suitability of the dataset for 
      
      AI/ML applications and can inform users about any specific considerations or restrictions related to using the dataset in AI/ML workflows. 

  training_use_status:
    range: YesNoConditionalEnum
    in_subset:
      - ai_usability_required
    description: >-
        Whether this dataset can be used for training AI models, based on factors such as data quality, completeness, and relevance.
        Use quotes to distinguish from boolean values.
        Controlled vocabulary:
        "Yes" | "No" | "Conditional"

        "Yes"        — suitable for use in training AI models
        
        "No"         — should not be used for training AI models
        
        "Conditional" — suitable for training under conditions described in restrictions
  
  training_use_conditions:
    range: string
    required: false
    in_subset:
      - ai_usability_if_applicable
    description: >-
        If training_use_status = "Conditional", this field is required and describes the specific conditions or restrictions that must be met for the dataset to be used for training AI models.
        This can provide users with important information about any limitations or considerations they should be aware of when using the dataset for training AI models.
  
  inference_use_status:
    range: YesNoConditionalEnum
    in_subset:
      - ai_usability_required
    description: >-
        Whether this dataset can be used for inference with AI models, based on factors such as data quality, completeness, and relevance.
        Use quotes to distinguish from boolean values.
        Controlled vocabulary:
        "Yes" | "No" | "Conditional"
        
        "Yes"        — suitable for use in inference with AI models
        
        "No"         — should not be used for inference with AI models
        
        "Conditional" — suitable for inference under conditions described in restrictions
  
  inference_use_conditions:
    range: string
    required: false
    in_subset:
      - ai_usability_if_applicable
    description: >-
        If inference_use_status = "Conditional", this field is required and describes the specific conditions or restrictions that must be met for the dataset to be used for inference with AI models.
        This can provide users with important information about any limitations or considerations they should be aware of when using the dataset for inference with AI models.

  evaluation_use_status:
    range: YesNoConditionalEnum
    in_subset:
      - ai_usability_required
    description: >-
        Whether this dataset can be used for evaluation of AI models, based on factors such as data quality, completeness, and relevance.
        Use quotes to distinguish from boolean values.
        Controlled vocabulary:
        "Yes" | "No" | "Conditional"
        
        "Yes"        — suitable for use in evaluation of AI models
        
        "No"         — should not be used for evaluation of AI models
        
        "Conditional" — suitable for evaluation under conditions described in restrictions
  
  evaluation_use_conditions:
    range: string
    required: false
    in_subset:
      - ai_usability_if_applicable
    description: >-
        If evaluation_use_status = "Conditional", this field is required and describes the specific conditions or restrictions that must be met for the dataset to be used for evaluation of AI models.
        This can provide users with important information about any limitations or considerations they should be aware of when using the dataset for evaluation of AI models.

  restrictions:
    range: string
    required: true
    in_subset:
      - ai_usability_required
    description: >-
      Any specific restrictions or conditions related to using this dataset in AI/ML workflows, if applicable.
      
      e.g., "Not for clinical decision-making"
      
      e.g., not_applicable | none | n/a
      
      Be explicit if there are no applicable restrictions (e.g., "not_applicable") rather than leaving this field blank.
      
      This can provide users with important information about any limitations or considerations they should be aware of when using the dataset in AI/ML applications.

  bias_risks:
    range: string
    required: true
    in_subset:
      - ai_usability_required
    description: >-
      Any known or potential bias risks associated with using this dataset in AI/ML workflows, if applicable.
      
      e.g., "Overrepresents samples from facility X"
      
      e.g., "Dataset is predominantly from one demographic group, which may introduce bias in AI models trained on this data."
      
      e.g., not_applicable | none | n/a
      
      Be explicit if there are no known or potential bias risks (e.g., "not_applicable") rather than leaving this field blank.
      
      This can provide users with important information about any ethical considerations or limitations they should be aware of when using the dataset in AI/ML applications.

  safety_considerations:
    range: string
    required: true
    in_subset:
      - ai_usability_required
    description: >-
      Any known or potential safety considerations associated with using this dataset in AI/ML workflows, if applicable.
      
      e.g., "Contains personally identifiable information (PII) that could pose privacy risks if not handled properly."
      
      e.g., "Dataset includes sensitive information that could be misused if not properly safeguarded."
      
      e.g., not_applicable | None | N/A
      
      Be explicit if there are no known or potential safety considerations (e.g., "not_applicable") rather than leaving this field blank.
      
      This can provide users with important information about any ethical considerations or limitations they should be aware of when using the dataset in AI/ML applications.

  human_review_required:
    range: YesNoEnum
    required: false
    in_subset:
      - ai_usability_required
    description: >-
      "Yes"|"No" — Whether human review is recommended when using this dataset in AI/ML workflows, based on factors such as data quality, completeness, relevance, and any known risks or considerations.
      This can provide users with guidance on whether they should incorporate human review into their AI/ML workflows when working with this dataset, which can help mitigate potential risks and ensure responsible use of the data.

  data_quality:
    range: DataQualityClass
    inlined: true
    in_subset:
      - reusability_required
    description: >-
      Block containing elements to provide information about the quality of the dataset, 
      including any known issues, limitations, or uncertainties that may affect its suitability for AI/ML applications.
      
      This can provide users with important context about the dataset's quality and reliability, which can inform their decisions about using the dataset in AI/ML workflows

  completeness:
    range: string
    required: true
    in_subset:
      - reusability_required
    description: >-
      Information about the completeness of the dataset, including any known gaps, missing values, or limitations in the data that may affect its suitability for AI/ML applications.
      
      e.g., "All detector channels present; 2% of timesteps"
      
      e.g., "Missing data for 5% of samples due to sensor downtime"
      
      e.g., "Dataset is complete with no known gaps or missing values"
      
      e.g., not_applicable
      
      This can provide users with important context about the dataset's completeness and reliability, 
      which can inform their decisions about using the dataset in AI/ML workflows.

  known_issues:
    range: string
    required: true
    in_subset:
      - reusability_required
    description: >-
      Any known issues or limitations with the dataset that may affect its suitability for AI/ML applications, if applicable.
      
      e.g., "Sensor drift observed after 2023-06-01T12:00:00Z"
      
      e.g., "Sensor calibration drift affects accuracy of measurements after June 2023"
      
      e.g., "Data from Facility X may have quality issues due to known equipment problems during the data collection period"
      
      e.g., not_applicable
      
      Be explicit if there are no known issues or limitations (e.g., "not_applicable") rather than leaving this field blank.
      
      This can provide users with important information about any potential problems or limitations with the dataset, 
      which can inform their decisions about using the dataset in AI/ML workflows.

  validation_methods:
    range: string
    required: true
    in_subset:
      - reusability_required
    description: >-
      Information about any validation methods or processes that have been applied to the dataset to assess its quality and suitability for AI/ML applications, if applicable.
      
      e.g., "Cross-validated against NIST SRM 640f"
      
      e.g., "Dataset validated against ground truth measurements from Facility Y"
      
      e.g., "Data quality assessed using method Z with the following results: ..."
      
      e.g., not_applicable
      
      Be explicit if there are no validation methods or processes (e.g., "not_applicable") rather than leaving this field blank.
      
      This can provide users with important information about the steps taken to validate the dataset, 
      which can inform their confidence in the dataset's quality and reliability for AI/ML applications.

  noise_characteristics:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Information about the noise characteristics of the dataset, if applicable.
      
      e.g., "Signal-to-noise ratio (SNR) of 20 dB across all channels"
      
      e.g., "Noise level increases by 5% after June 2023 due to equipment degradation"
      
      e.g., "Dataset has low noise levels with no known issues"
      
      e.g., not_applicable
      
      Be explicit if there are no known noise issues or characteristics (e.g., "not_applicable") rather than leaving this field blank.
      
      This can provide users with important information about the noise characteristics of the dataset, 
      which can inform their decisions about using the dataset in AI/ML workflows.
  
  uncertainty_notes:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Any known uncertainties or limitations in the dataset that may affect its suitability for AI/ML applications, if applicable.
      
      e.g., "Measurement uncertainty ±0.5% (k=2) per ISO/IEC Guide 98-3"
      
      e.g., "Uncertainty increases to ±10% for measurements taken after June 2023 due to equipment degradation"
      
      e.g., "Dataset has low uncertainty with no known issues"
      
      e.g., not_applicable
      
      Be explicit if there are no known uncertainties or limitations (e.g., "not_applicable") rather than leaving this field blank.
      
      This can provide users with important information about any uncertainties or limitations in the dataset, 
      which can inform their decisions about using the dataset in AI/ML workflows.
  
  missing_data_codes:
    range: MissingDataCodesClass
    required: false
    multivalued: false
    inlined: true
    inlined_as_list: true
    in_subset:
      - reusability_if_applicable
    description: >-
      If the dataset contains missing values, list the missing codes and their meanings using the MissingDataCodes block. 
      
      e.g., "-9999", and "Indicates sensor failure; -8888 indicates data not collected; -7777 indicates value below detection limit"
      
      e.g., "NULL", and "Indicates missing value"
      
      This can provide users with important information about how missing data is represented in the dataset, 
      which can inform their decisions about how to handle missing values when using the dataset in AI/ML workflows

  code:
    range: string
    identifier: true
    in_subset:
      - reusability_if_applicable
    description: >-
      A placeholder slot for any code or script associated with the dataset, 
      such as data processing scripts, analysis code, or code used to generate the dataset.
      
      e.g., "-9999"
      
      e.g., "NULL"
      
      This can provide users with access to code that is relevant to understanding and using the dataset effectively.

  integrity:
    range: IntegrityClass
    inlined: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Contains elements describing checksums enable automated validation of data integrity after transfer or storage.

  checksum_available:
    range: YesNoEnum
    in_subset:
      - reusability_if_applicable
    description: >-
      "Yes"|"No" — Whether a checksum is available for this dataset, 
      which can be used to verify the integrity of the data after transfer or storage.

  checksum_type:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      The type of checksum available for this dataset, if applicable.
      
      This can provide users with information about the method used to generate the checksum, 
      which can inform their decisions about how to use the checksum for data integrity verification.
  
  checksum_value:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      The value of the checksum for this dataset, if applicable.
      This can be used by users to verify the integrity of the data after 
      transfer or storage by comparing the provided checksum value with a newly 
      generated checksum from the transferred or stored data.
  
  fixity_policy:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Information about the fixity policy for this dataset, 
      including how often fixity checks are performed and any specific procedures 
      or tools used for fixity verification.
      
      e.g., "Monthly sha256 verification via repository integrity service"
      
      This can provide users with important information about the measures taken to ensure the integrity of the dataset over time, 
      which can inform their confidence in the dataset's reliability.

  semantic_layer:
    range: SemanticLayerClass
    inlined: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Required for Genesis Readiness Framework Level 3 datasets intended for federated or cross-domain use. 
      
      Populate schema_url at minimum.
      
      Contains elements to provide a machine-readable semantic layer for the dataset,
      which can enhance discoverability, interoperability, and usability of the data for AI/ML applications.
    
  schema_url:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      URL pointing to the schema or ontology that defines the semantic layer for this dataset.
      URL to a formal schema for this dataset, e.g., URL to a JSON Schema | XML Schema | NeXus application definition
      
      e.g., "https://example.com/schema/dataset_semantic_layer.json"
      
      e.g., "https://example.com/ontology/dataset_semantic_layer.owl"
      
      e.g., not_applicable if there is no formal schema or ontology for this dataset.
      
      Be explicit if there is no formal schema or ontology (e.g., "not_applicable") rather than leaving this field blank.
      
      This can provide users with access to the formal definitions and relationships that underpin the dataset's semantic layer, 
      which can inform their understanding of the dataset's structure and meaning for AI/ML applications.

  semantic_context:
    range: string
    multivalued: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      A human-readable description of the semantic context and structure of the dataset, if applicable.
      Semantic conventions applied. Examples:
      "NetCDF CF Conventions 1.10" | "NeXus NXmonopd" | "Custom schema with the following key classes and relationships: ..."
      
      This can provide users with important information about the meaning and relationships 
      of the data elements within the dataset, 
      which can inform their understanding and use of the dataset for AI/ML applications.

  any_value:
      range: AnyValue
      description: "A placeholder slot that can be used when the value can be of any type or is not known in advance."