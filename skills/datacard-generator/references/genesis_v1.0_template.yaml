# ============================================================
# GENESIS MISSION DATA CARD v1.0
# ============================================================
# This data card describes datasets ingested or created within
# the Genesis Mission. It is designed for human and machine
# authorship and ingestion across all sensitivity levels and
# publication states — from raw in-workflow data through
# published and archived datasets.
#
# INTENDED CAPABILITIES — set the top-level data card capabilities to
# declare the intended use and guide authors on which fields to fill in.
#   * supports_discoverability: "Yes" - required for all data cards.
#     Indicates whether the dataset described in the data card is intended to be discoverable in catalogs and repositories, to support basic findability.
#     This is a high-level indication of whether the dataset is intended to be discoverable, 
#     and does not necessarily indicate that the dataset is currently discoverable or that it meets all criteria for discoverability.
#   * supports_accessibility: "Yes"|"No" - "Yes" is optional, but recommended, for all data cards. 
#      Indicates whether the dataset described in the data card is intended to be shared or accessed by others, 
#      whether internally within a project or organization, with external collaborators, or publicly.
#      This is a high-level indication of whether the dataset is intended to be accessible, 
#      and does not necessarily indicate that the dataset is currently accessible or that it meets all criteria for accessibility.
#   * supports_interoperability: "Yes"|"No" - "Yes" is optional, but recommended, for all data cards. 
#     Indicates whether the dataset described in the data card is intended to be interoperable, 
#     meaning it is intended to be integrated with other datasets or systems, 
#     or used in combination with other datasets.
#     This is a high-level indication of whether the dataset is intended to be interoperable, 
#     and does not necessarily indicate that the dataset is currently interoperable or that it meets all criteria for interoperability.
#   * supports_reusability: "Yes"|"No" - "Yes" is optional, but recommended, for all data cards.
#     Indicates whether the dataset described in the data card is intended to be reusable, 
#     meaning it is intended to be reused by others for the same or different purposes.
#     This is a high-level indication of whether the dataset is intended to be reusable, 
#     and does not necessarily indicate that the dataset is currently reusable or that it meets all criteria for reusability.
#   * supports_governed_use: "Yes"|"No" - "Yes" is optional, but recommended, for all data cards.
#     Indicates whether the dataset described in the data card is intended to be shared or accessed under specific governance or oversight, 
#     such as datasets that are subject to security controls, export control, or other types of formal review and approval processes.
#     This is a high-level indication of whether the dataset is intended to be shared or accessed under specific governance or oversight, 
#     and does not necessarily indicate that the dataset is currently shared or accessed under specific governance or oversight, 
#     or that it meets all criteria for governed use.
#   * supports_ai_usability: "Yes"|"No" - "Yes" is optional, but recommended, for all data cards.
#     Indicates whether the dataset described in the data card is intended to be used for AI training, evaluation, or other AI-related purposes.
#     This is a high-level indication of whether the dataset is intended to be used for AI purposes, 
#     and does not necessarily indicate that the dataset is currently used for AI purposes or that it meets all criteria for AI usability.
#
#
# FIELD ANNOTATIONS:
#   [required]                      — required for all intended capabilities; must be filled in for all data cards
#   [discoverability_required]      — required for supports_discoverability = "Yes" data cards.
#   [discoverability_if_applicable] — optional for supports_discoverability = "Yes" data cards; 
#                                     populate if applicable to support discoverability, 
#                                     but may be removed/left blank if not yet known or not applicable.
#   [accessibility_required]        — required for supports_accessibility = "Yes" data cards.
#   [accessibility_if_applicable]   — optional for supports_accessibility = "Yes" data cards;
#                                     populate if applicable to support accessibility,
#                                     but may be removed/left blank if not yet known or not applicable.
#   [interoperability_required]     — required for supports_interoperability = "Yes" data cards.
#   [interoperability_if_applicable]— optional for supports_interoperability = "Yes" data cards;
#                                     populate if applicable to support interoperability,
#                                     but may be removed/left blank if not yet known or not applicable.
#   [reusability_required]         — required for supports_reusability = "Yes" data cards.
#   [reusability_if_applicable]   — optional for supports_reusability = "Yes" data cards;
#                                     populate if applicable to support reusability,
#                                     but may be removed/left blank if not yet known or not applicable.
#   [governed_use_required]       — required for supports_governed_use = "Yes" data cards.
#   [governed_use_if_applicable]  — optional for supports_governed_use = "Yes" data cards;
#                                     populate if applicable to support governed use,
#                                     but may be removed/left blank if not yet known or not applicable.
#   [ai_usability_required]       — required for supports_ai_usability = "Yes" data cards.
#   [ai_usability_if_applicable]  — optional for supports_ai_usability = "Yes" data cards;
#                                     populate if applicable to support AI usability,
#                                     but may be removed/left blank if not yet known or not applicable.
#
# PLACEHOLDER CONVENTIONS:
#   ${VALUE}        — fill in your value;
#   __VALUE__       — fill in if applicable; delete or leave blank if not
#   not_applicable  — use when a field definitively does not apply
#                     (distinct from blank, which means "not yet known")
#
# NOTE ON null vs. not_applicable:
#   Blank / __VALUE__ = information not yet known or not yet captured.
#   not_applicable    = this field definitively does not apply to this dataset.
#   This distinction enables automated completeness scoring and catalog quality metrics.
#
# NOTE ON SENSITIVITY:
#   This template has two independent sensitivity sections:
#    discoverability.datacard.sensitivity  — sensitivity of THIS DATA CARD DOCUMENT
#    discoverability.sensitivity  — sensitivity of THE DATASET ITSELF
#   These are intentionally independent and will often differ.
#   Example: an open data card (discoverability.datacard.sensitivity.overall_sensitivity = Public) may
#   describe a classified dataset (discoverability.sensitivity.overall_sensitivity = Classified).
#   Do not assume they should match. Set each based on its own subject.
#
# NOTE ON LICENSES AND GOVERNANCE:  
#   A public/open license is not always the governing instrument for use,
#   some controlled datasets may not have an SPDX-style reuse license at all,
#   and use may instead be governed by contract, agreement, institutional review, or repository policy.
#
# NOTE ON WORKFLOW STATE vs. RELEASE STATUS:
#   discoverability.workflow.state   — describes the technical/processing lifecycle position
#                      of the data itself (Raw → Archived)
#   discoverability.release_status   — describes the publication and governance state
#                      of the dataset record (Draft → Deprecated)
#   These should be logically consistent. Common alignments:
#     discoverability.workflow.state=Raw|Processing|QA|Analysis → discoverability.release_status=Draft
#     discoverability.workflow.state=Review                     → discoverability.release_status=Under_Review
#     discoverability.workflow.state=Embargo|Published          → discoverability.release_status=Approved|Published
#     discoverability.workflow.state=Archived                   → discoverability.release_status=Deprecated|Published
#
# SCHEMA VALIDATION:
#   A companion JSON Schema for machine validation is available at:
#   https://gitlab.osti.gov/genesis/data-cards (refer to the README.md for usage instructions).
#   Validate your data card before submission using the Genesis LinkML data card validator (refer to README.md for instructions) 
#   or any JSON Schema-compatible YAML validator.
#
# FUTURE EXTENSIONS:
#   This template will evolve. Fields under consideration for future
#   versions include ontology alignment, interoperability standards
#   (DCAT, schema.org), audience classification, consent typing
#   and catalog-managed collection membership.
#   See https://gitlab.osti.gov/genesis/data-cards for the roadmap.
# ============================================================

# ------------------------------------------------------------
# DATA CARD INTENDED CAPABILITIES
# Describes the intended capabilities to be enabled for this data card, to guide authors, ensure completeness, and inform parsers.
# ------------------------------------------------------------
supports_discoverability: "Yes"  # [required] "Yes" is required as all data cards must support basic discovery and identification of the dataset. 
                                # "Yes" is required for all data cards.
supports_accessibility: "Yes|No"  # [required] Set to "Yes" if this data card includes the metadata to support accessibility of the dataset. Required for data cards describing datasets that are shared or published.
                                # Does not necessary indicate that the dataset itself is accessible, 
                                # only that the data card includes all the metadata to support accessibility.
supports_interoperability: "Yes|No"  # [required] Set to "Yes" if this data card includes the metadata to support interoperability of the dataset.
                                # Does not necessary indicate that the dataset itself is interoperable, 
                                # only that the data card includes all the metadata to support interoperability.
supports_reusability: "Yes|No"  # [required] Set to "Yes" if this data card includes the metadata to support reusability of the dataset.
                                # Does not necessary indicate that the dataset itself is reusable, 
                                # only that the data card includes some metadata to support reusability.
supports_governed_use: "Yes|No"  # [required] Set to "Yes" if this data card includes the metadata to support governed use of the dataset.
                                # Does not necessary indicate that the dataset itself is cleared for governed use, 
                                # only that the data card includes some metadata to support governed use.
supports_ai_usability: "Yes|No"  # [required] Set to "Yes" if this data card includes the metadata to support AI usability of the dataset.
                                # Does not necessary indicate that the dataset itself is AI-usable, 
                                # only that the data card includes some metadata to support AI usability.

# ============================================================
# DISCOVERABILITY                   [REQUIRED]
# ============================================================
# Required for all datasets regardless of publication state other intended capabilities. Populate the fields marked [discoverability_required] to support basic discovery and identification of this dataset, and to provide essential context for understanding the dataset's sensitivity and use. Population discoverability_if_applicable fields is optional but recommended to further enhance discoverability and support responsible use.
# ============================================================

discoverability:
  # ------------------------------------------------------------
  # DATA CARD METADATA
  # Describes this document itself — not the dataset.
  # ------------------------------------------------------------
  datacard:
    template_version: "1.0"                     # [discoverability_required] DO NOT MODIFY — used by parsers to apply version-specific logic
    datacard_version: "1.0"                     # [discoverability_required] Version of this specific data card document.
                                                # Increment when the data card is meaningfully updated.
                                                # Use semantic versioning: MAJOR.MINOR.PATCH
                                                # e.g., 1.0 → 1.1 for content updates; 1.x → 2.0 for structural changes
    filename: "genesis_datacard_${SNAKE_CASE_DATASET_NAME}.md"  # [discoverability_required] Follow naming convention; align with identification.name
    language: en                                # [discoverability_required] ISO 639-1 language code for this data card's content

    id:                                         # [discoverability_if_applicable] Persistent identifier for this data card document itself,
                                                # distinct from the dataset identifier. Assign if the data card is
                                                # registered in a catalog or repository independently of the dataset.
      type: __TYPE__                            # doi | ark | handle | url | local | other
      value: __VALUE__

    sensitivity:                                # Sensitivity of the DATA CARD itself, which may differ from the sensitivity of the dataset it describes. Populate based on the sensitivity of the data card content alone, not the dataset. See NOTE ON SENSITIVITY above.
      overall_sensitivity: ${OVERALL_SENSITIVITY} # [discoverability_required] The overall sensitivity of THE DATA CARD only.
                                                # Set based solely on the sensitivity of this data card.
                                                # not the dataset it describes. See NOTE ON SENSITIVITY above.
                                                # The sensitivity of the data card and the dataset are independent and will often differ.
                                                #   Uses a controlled vocabulary:
                                                # - Public: No sensitivity; publicly shareable.
                                                # - Unclassified_Uncontrolled: Unclassified but uncontrolled; may have minimal sensitivity; generally shareable with minimal controls.
                                                # - CUI: CUI (Controlled Unclassified Information); requires handling per CUI guidelines; access controls required.
                                                # - UCNI: UCNI (Unclassified Controlled Nuclear Information); requires handling per UCNI guidelines; strict access controls required.
                                                # - Classified: Classified information; requires handling per classification level and guide; strict access controls required.
                                                # - Legacy_Controlled: Legacy controlled information; may have specific handling requirements based on legacy controls; access controls required.
                                                # - Mixed: Mixed sensitivity; contains a combination of sensitive and non-sensitive information; handling requirements depend on the specific content; access controls required.
                                                # - Other_Controlled: Other controlled information; may have specific handling requirements based on other controls; access controls required.
      source_marking_string: __STRING__         # [discoverability_required] If this data card has a source marking, provide the marking string exactly as it appears on the data card.
      source_marking_scheme: __SCHEME__         # [discoverability_required] If this data card has a source marking, provide the marking scheme used.
                                                # use vocabulary: DOE_CUI | DOE_UCNI | EO13526_Classified | AEA_RD_FRD_TFNI | DOD_CUI | DHS_CUI | Legacy_OUO | Legacy_Site_Specific | Other_Agency | None
                                                # if a Legacy_OUO is unresolved to a current standard marking, normalized_control_basis should be populated as "Legacy_Needs_Mapping" to indicate that the control basis is legacy and needs interpretation for governance purposes.
      classified_status: __STATUS__             # [discoverability_required] "Yes" | "No" description: Indicates whether the asset is classified.
      classification_level: __LEVEL__           # [discoverability_if_applicable] For classified information, top_secret | secret | confidential classification level
      classification_category: []               # [discoverability_if_applicable] For classified information, list the classification category or categories, if applicable.
                                                # use vocabulary: NSI | RD | FRD | TFNI | Other_Classified
      classified_control_markings: []           # [discoverability_if_applicable] For classified information, list the specific control markings that apply, if any.  
                                                # Provide as a list of unique entries if multiple markings apply.
                                                # e.g., - "NOFORN"
                                                #       - "CNWDI"
                                                #       - "SIGMA 14"
                                                #       - "REL TO USA, CAN, GBR"
                                                #       - "ORCON"
      cui_status: __STATUS__                    # [discoverability_required] "Yes" | "No" description: Indicates whether the asset is CUI.
      cui_basic_categories: []                     # [discoverability_if_applicable, at least one basic or specified category is required if cui_status = "Yes"] For CUI, list the basic category or categories that apply, if any.         
                                                  # use DOE/ISOO-authoritative CUI Basic categories or subcategories.
                                                  # provide as a list of unique entries if multiple categories apply.
      cui_specified_categories: []                  # [discoverability_if_applicable, at least one basic or specified category is required if cui_status = "Yes"] For CUI, list the specified category or categories that apply, if any.   
                                                  # use DOE/ISOO-authoritative CUI Specified categories or subcategories.
                                                  # provide as a list of unique entries if multiple categories apply.
      cui_limited_dissemination_controls: []        # [discoverability_if_applicable] List the applicable CUI limited dissemination controls, if any. 
                                                  # provide as a list of unique entries if multiple controls apply.
                                                  # e.g., - "NOFORN"
                                                  #       - "DL ONLY"
                                                  #       - " REL TO USA, GBR"
                                                  #       - "DISPLAY ONLY USA, GBR"
                                                  #       - "RELIDO"
                                                  # If cui_limited_dissemination_controls contains NOFORN, REL TO..., DISPLAY ONLY...,
                                                  # or similar controls, foreign_national_access_status should be consistent with those controls.
      ucni_status: __STATUS__                     # [discoverability_required] "Yes" | "No" description: Indicates whether the asset contains UCNI. UCNI is represented separately
                                                  # and should not be treated as an ordinary CUI category value.
      uk_mda_status: __STATUS__                   # [discoverability_if_applicable] "Yes" | "No"| "Unknown" | "not_applicable"
                                                  # Indicates whether the asset is subject to UK Ministry of Defence Assessment (MDA) controls.
      legacy_label_source: []                     # [discoverability_if_applicable]  Preserves deprecated or local historical control labels such as OUO, SBU,
                                                  # if source_marking_scheme = Legacy_OUO, legacy_label_source should be populated                                             
                                                  # or site-specific legacy markings as provenance/source information only.
                                                  # Provide as a list of unique entries if multiple legacy labels apply.
                                                  # E.g., - "OUO"
                                                  #      - "SBU"
      normalized_control_basis: __BASIS__         # [discoverability_if_applicable] Optional interpreted control basis used for governance where source materials
                                                  # This does not replace authoritative source markings.
                                                  # Provide as a list of unique entries if multiple control bases apply.
                                                  # If source_marking_scheme = Legacy_OUO and the legacy marking is unresolved to a current standard marking, 
                                                  # this should be populated as "Legacy_Needs_Mapping" to indicate that the control basis is legacy and needs interpretation for governance purposes.
                                                  # Entries should use this controlled vocabulary:  
                                                  # - "Classified"
                                                  # - "CUI"
                                                  # - "UCNI"
                                                  # - "Public_Release_Approved"
                                                  # - "Legacy_Needs_Mapping"
                                                  # - "Other_Controlled"

    created_date: "${YYYY-MM-DD}"               # [discoverability_required] ISO 8601 date this data card was first created
    updated_date: "${YYYY-MM-DD}"               # [discoverability_required] ISO 8601 date of most recent update; revise on every change

    change_log:                                 # [discoverability_required] Running history of meaningful changes to this data card.
                                                # Add a new entry every time the data card is updated.
                                                # Do not overwrite or delete prior entries.
      - change_date: "${YYYY-MM-DD}"                   # [discoverability_required] ISO 8601 date of this change
        datacard_version: "1.0"                 # [discoverability_required] Data card version after this change; pre-filled for initial creation
        summary: "Initial creation"             # [discoverability_required] Brief description of what changed and why.
                                                # Update this text for all subsequent revisions.
                                                # e.g., "Updated license to CC-BY-4.0"
                                                # e.g., "Added checksum after file transfer to OSTI"
                                                # e.g., "Corrected collection end date"
    creation_method: ${METHOD}                  # [discoverability_required] Method used to create or most recently update this data card.
                                                # Manual | Automated | Hybrid
    created_by:                                 # [discoverability_required] All individuals, organizations, AI models, or software tools
                                                # that created or updated this data card. List in chronological order
                                                # of contribution — e.g., if an AI model generated the initial draft
                                                # and a person then edited it, list the AI model first.
      - role: ${ROLE}                           # [discoverability_required] initial_creation | editor | reviewer | updater
        contribution_date: "${YYYY-MM-DD}"      # [discoverability_required] ISO 8601 date of this specific contribution
        description: __DESCRIPTION__            # [discoverability_if_applicable] Describe what this contributor did.
                                                # e.g., "Automated generation of data card from dataset metadata"
                                                # e.g., "Reviewed and corrected AI-generated content"
        creator:                                # [discoverability_required] person | organization | ai_model | software
                                                # add one block per creator; 
                                                # list the block that corresponds to the parent {ROLE} contributed to the creation of this data card
                                                # Delete the three blocks below that do not apply.
          agent_type: ${TYPE}                   # [discoverability_required] person | organization | ai_model | software
                                                # TYPE: person — use for a human contributor
          person:
            given_name: ${GIVEN_NAME}
            family_name: ${FAMILY_NAME}
            orcid: __ORCID__                    # [discoverability_if_applicable] Format: https://orcid.org/0000-0000-0000-0000
                                                # Required where DOE employee/contractor author policy applies, if locally applicable
                                                # Register at https://orcid.org if needed
            email: ${EMAIL}
            affiliation:
              name: ${ORG_NAME}
              ror_id: __ROR_ID__                 # [discoverability_if_applicable] Format: https://ror.org/XXXXXXX
                                                # Look up at https://ror.org

          # TYPE: organization — use when a team or org created the data card without a named individual
          organization:
            name: ${ORG_NAME}
            ror_id: __ROR_ID__

          # TYPE: ai_model — use when an AI model generated or substantially contributed to this data card
          ai_model:
            name: ${MODEL_NAME}                  # e.g., Claude 3.5 Sonnet | GPT-4o | Llama 3
            version: __VERSION__
            accessed_date: "${YYYY-MM-DD}"
            identifier:
              type: __TYPE__                     # doi | ark | handle | url | local | other
              value: __VALUE__                   # Link to model card or documentation if available

          # TYPE: software — use when an automated pipeline or script generated this data card
          software:
            name: ${SOFTWARE_NAME}
            version: __VERSION__
            identifier:
              type: __TYPE__                     # doi | ark | handle | url | local | other
              value: __VALUE__
  # --- Identification ---------------------------------------------
  identification:                               # [discoverability_required] Key metadata fields that uniquely identify this dataset.
    name: "${DATASET_NAME}"                     # [discoverability_required] Single human-readable name for this dataset.
                                                # Use the same name in the data card filename.
                                                # If this data card covers a collection, provide the collection name.
    project: "${PROJECT_NAME}"                  # [discoverability_required] Genesis project or sub-project this dataset belongs to.
                                                # e.g., genesis | genesis-fusion | genesis-lightsource
    version: "1.0"                              # [discoverability_required] Dataset version using semantic versioning: MAJOR.MINOR.PATCH
                                                # Increment MAJOR for breaking changes, MINOR for additions,
                                                # PATCH for corrections. Start at 1.0 for first release.
                                                # See supersedes / superseded_by below for linking versions,
                                                # and stewardship.versioning_strategy for how versions are managed.

    primary_id:                                 # [discoverability_required] Primary persistent identifier for this dataset.
                                                # Aligns with dcterms:identifier and is the main identifier used in citations and references.
                                                # Use ark or local if a DOI has not yet been assigned.
      type: ${TYPE}                             # doi | ark | handle | url | osti | local | other | unregistered
      value: ${VALUE}
      # ARK format:  ark:/NAAN/shoulder+assigned_name  e.g., ark:/12345/b2345679k
      # Resolve via: https://n2t.net/ark:/NAAN/...
      # Convention:  use ark for pre-published states; mint a doi upon publication
      #              and retain the ark in additional_ids for provenance continuity

    additional_ids:                             # [discoverability_if_applicable] Additional identifiers for this dataset.
                                                # Aligns with adms:identifier and can include secondary identifiers, legacy identifiers, or identifiers for specific versions if primary_id is a collection-level identifier.
      - type: __TYPE__                          # doi | ark | handle | url | osti | sand | la-ur | local | other
        value: __VALUE__                        # e.g., SAND2024-XXXXX | LAUR-XX-XXXXX

    supersedes:                                 # [discoverability_if_applicable] Identifier of the prior version this dataset replaces.
                                                # See stewardship.versioning_strategy for how versions are managed.
      type: __TYPE__                            # doi | ark | handle | url | local | other
      value: __VALUE__

    superseded_by:                              # [discoverability_if_applicable] Identifier of the newer version that replaces this dataset.
                                                # Populate when this version is deprecated.
      type: __TYPE__                            # doi | ark | handle | url | local | other
      value: __VALUE__

    parent_collection:                          # [discoverability_if_applicable] Parent collection or experimental campaign this
                                                # dataset belongs to. Use when this dataset is one of many in a
                                                # larger organized collection or ensemble.
      name: __NAME__
      identifier:
        type: __TYPE__                          # doi | ark | handle | url | local | other
        value: __VALUE__
  # --- Description ------------------------------------------------
  dataset_description:                        # [discoverability_required] Descriptive metadata about the dataset to support discovery, understanding, and reuse.
    science_domain: "${DOMAIN}"               # [discoverability_if_applicable] High-level scientific domain or discipline.
                                              # e.g., materials_science | biology | physics | chemistry
                                              #        climate | fusion | lightsource | computer_science | other
    dataset_summary: "${SUMMARY}"             # [discoverability_required] 1–3 sentence plain-language description of the dataset.
                                              # Write for a broad scientific audience unfamiliar with your project.
    purpose: __PURPOSE__                      # [discoverability_if_applicable] Why was this dataset created? What gap does it fill?
    collection_methodology: __METHODOLOGY__   # [discoverability_if_applicable] How was data acquired?
                                              # e.g., experimental sensors | computational simulation |
                                              #        human annotation | derived from prior datasets
    data_characteristics: __CHARACTERISTICS__ # [discoverability_if_applicable] Key structural and content characteristics:
                                              # scale, dimensionality, temporal coverage, spatial resolution
    limitations: __LIMITATIONS__              # [discoverability_if_applicable] Known limitations, gaps, or caveats users should
                                              # be aware of before using this dataset.
    tags:                                     # [discoverability_if_applicable] Structured tags for catalog filtering and discovery.
      project: ${PROJECT}                     # e.g., genesis
      science: __SCIENCE__                    # e.g., lightsource | fusion | materials | biology
      object_type: __TYPE__                   # select one of: Dataset | Model | Software | AI_Agent | Eval | Framework | Software
    task_category: []                         # [discoverability_if_applicable, at least one value required if task_subcategory is present] Primary ML task category or categories for this dataset.
                                              # Populate for AI-ready data; helps ML practitioners find
                                              # relevant datasets in the catalog.
                                              # e.g., classification | regression | segmentation | detection |
                                              #        generation | translation | summarization | ranking |
                                              #        anomaly_detection | clustering | reinforcement_learning | other
    task_subcategory: []                      # [discoverability_if_applicable] More specific ML task subcategory or subcategories.
                                              # e.g., binary_classification | multi_class_classification |
                                              #        multi_label_classification | image_segmentation |
                                              #        object_detection | time_series_forecasting |
                                              #        named_entity_recognition | question_answering | other
    keywords: []                              # [discoverability_required] Terms that describe this dataset and aid discovery.
                                              # Include domain terms, methods, instruments, and relevant ontology terms.
  # --- Product & Dataset Type --------------------------------------
  product_type: ${TYPE}                       # [discoverability_required] Primary type of product type described by this data card.
                                              # These align with and extend the STI Product Types to support interoperability with STI catalogs and OSTI DOE Data Explorer.
                                              # Select the single best-fit:
                                              # Technical_Report | Paper_or_Proceedings | Journal_Article | Software_Manual | Data | Collection | Computer_Related | Model | Agent
                                              # Data is expected here for a data card describing a dataset, but select the best fit if this data card describes a different type of product.

  dataset_type: ${TYPE}                         # [discoverability_if_applicable] OSTI DOE Data Explorer type code. Select the single best-fit:
                                                #   GD  Genome/Genetic Data     — DNA/RNA sequences, genomic annotations
                                                #   IM  Image                   — photographs, scans, microscopy, visualizations
                                                #   ND  Numeric Data            — measurements, time series, tabular, sensor readings
                                                #   SM  Specialized Mix         — multiple data types combined
                                                #   FP  Figure/Plot             — charts, graphs, plots as primary deliverable
                                                #   I   Interactive Resource    — web apps, interactive visualizations, dashboards
                                                #   MM  Multimedia              — audio, video, combined media
                                                #   MD  Model                   — computational models, simulations, trained ML models
                                                #   AS  Automated Software      — scripts, analysis pipelines, workflows
                                                #   IP  Instrumentation/Protocols — experimental protocols, instrument specs
                                                #   IG  Integrated Genomic Resources — combined genomic databases and tools

  # --- Release Status ---------------------------------------------
  release_status: ${STATUS}                     # [discoverability_required] Current publication and governance state of this dataset.
                                                # See NOTE ON WORKFLOW STATE vs. RELEASE STATUS in the header
                                                # for expected alignment with workflow.state.
                                                #   Draft         — work in progress; not ready for sharing
                                                #   Under_Review  — submitted for formal review
                                                #   Approved      — review complete; cleared for release
                                                #   Published     — publicly released and accessible
                                                #   Deprecated    — superseded or retired; no longer recommended for use

  dataset_publisher:                            # [discoverability_if_applicable, required when release_status = Approved | Published] 
                                                # Entity responsible for making this dataset available. Often the same as the primary research organization, but may differ if a separate publisher is involved.
    name: ${ORG_NAME}                           # [discoverability_if_applicable] Organization or individual that published this dataset.
    ror_id: __ROR_ID__                          # [discoverability_if_applicable] Format: https://ror.org/XXXXXXX

  # --- Dataset Contacts ---------------------------------------------------
  contact:                                     # [discoverability_required] Primary point of contact for questions about this DATASET.
    agent_type: ${TYPE}                        # person (only a person is allowed as the primary contact to ensure accountability and a clear point of contact) | organization (e.g., data management office if no single named contact)
    person:
      given_name: ${GIVEN_NAME}
      family_name: ${FAMILY_NAME}
      orcid: __ORCID__                         # [discoverability_if_applicable] Format: https://orcid.org/0000-0000-0000-0000
                                               # Required where DOE employee/contractor author policy applies, if locally applicable
      email: ${EMAIL}
      affiliation:
        name: ${ORG_NAME}
        ror_id: __ROR_ID__                     # [discoverability_if_applicable] Format: https://ror.org/XXXXXXX
    valid_until: __YYYY-MM-DD__               # [discoverability_if_applicable] Date after which this contact may no longer be valid.
                                              # Use for project-bound contacts (students, postdocs, term staff).
    succession_note: __NOTE__                 # [discoverability_if_applicable] Who to contact if this contact is no longer reachable.
                                              # e.g., "Contact the ORNL data management office at data@ornl.gov"

  additional_contacts: []                     # [discoverability_if_applicable] Additional contacts (e.g., instrument PI, data steward).
                                              # Same structure as contact above:
                                              # contact_details:
                                              # - type: person | organization
                                              #   person:
                                              #     given_name: __GIVEN_NAME__
                                              #     family_name: __FAMILY_NAME__
                                              #     orcid: __ORCID__ # Required where DOE employee/contractor author policy applies, if locally applicable
                                              #     email: __EMAIL__
                                              #     affiliation:
                                              #       name: __ORG_NAME__
                                              #       ror_id: __ROR_ID__
                                              #   valid_until: __YYYY-MM-DD__
                                              #   succession_note: __NOTE__

  # --- Authorship & Credit ----------------------------------------
  # [discoverability_required] At least one author required.
  # For draft or in-workflow data, populate with known contributors.
  authors:                                      # [discoverability_required]
    - type: ${TYPE}                             # person | organization
      person:
        given_name: ${GIVEN_NAME}
        family_name: ${FAMILY_NAME}
        orcid: __ORCID__                        # [if_applicable] Strongly recommended — enables disambiguation and credit tracking
                                                # Required where DOE employee/contractor author policy applies, if locally applicable
        email: __EMAIL__                        # [if_applicable]
        affiliation:
          name: ${ORG_NAME}
          ror_id: __ROR_ID__                    # [if_applicable]
        role: ${ROLE}                           # creator | contributor | data_collector | curator | publisher | sponsor | other
      organization:
        name: __ORG_NAME__
        ror_id: __ROR_ID__
        role: ${ROLE}                           # creator | contributor | data_collector | curator | publisher | sponsor | other

  contributors: []                              # [discoverability_if_applicable] Supporting contributors who are not primary authors.
                                                # e.g., sample preparers, annotators, reviewers, submitters.
                                                # Same structure as authors above.

  # --- Sponsor Organizations and Program Office [discoverability_required, discoverability_if_applicable] -------------------------------------
  # Sponsor organizations are those that funded or sponsored the dataset, 
  # Populate with known information even for in-workflow data;
  #  this supports provenance tracking and credit assignment from the earliest stages of the project.
  sponsor_organizations:                       # [discoverability_required] Organizations that funded or sponsored this dataset.
    - name: ${ORG_NAME}                        # e.g., DOE Office of Science | NNSA | NSF
      ror_id: __ROR_ID__                       # [discoverability_if_applicable]
      award_number: __AWARD__                  # [discoverability_if_applicable] e.g., DE-AC05-00OR22725
      funding_source: __SOURCE__               # [discoverability_if_applicable] Identifies the funding source from a controlled vocabulary: 
                                               # DOE_Program_SC | DOE_Program_NNSA | LDRD | WFO | CRADA | Other_Federal | State_Government | Subcontract | Industry | Nonprofit | Internal | Other
      program: __PROGRAM__                     # [discoverability_if_applicable] e.g., "Advanced Scientific Computing Research"

  sponsoring_doe_program_office: __NAME__      # [discoverability_if_applicable] DOE program office that sponsored this dataset, if applicable.
  sponsoring_doe_subprogram: __NAME__          # [discoverability_if_applicable] DOE subprogram that sponsored this dataset, if applicable. 

  # --- Research Organizations [discoverability_required] -------------------------------------
  # Research organizations are those that created or collected the data. 
  # Populate with known information even for in-workflow data;
  #  this supports provenance tracking and credit assignment from the earliest stages of the project.
  research_organizations:                      # [discoverability_required] Organizations that created or collected the data.
    - name: ${ORG_NAME}                        # e.g., Oak Ridge National Laboratory | Sandia National Laboratories
      ror_id: __ROR_ID__                       # [discoverability_if_applicable]

  # --- Facilities [discoverability_if_applicable] -------------------------------------
  # Facilities are user facilities, HPC centers, or research infrastructure used to 
  #  collect, process, or store the dataset. 
  # Populate with known information even for in-workflow data;
  #  this supports provenance tracking and credit assignment from the earliest stages of the project.
  facilities: []                              # [discoverability_if_applicable] User facilities, HPC centers, or research infrastructure
                                              # used to collect, process, or store the dataset.
    # - name: __FACILITY_NAME__               # e.g., Spallation Neutron Source | Summit | Frontier
    #   ror_id: __ROR_ID__
    #   role: __ROLE__                        # collection | processing | storage | access
    #   location:                             # [discoverability_if_applicable] Point location for facility-based experimental data.
    #     description: __DESC__               # e.g., "SNS Beamline 1B, Oak Ridge National Laboratory, TN, USA"
    #     ror_id: __ROR_ID__                  # ROR ID of the facility; cross-reference with name above

  # --- Genesis Sensitivity & Security ----------------------------------
  #  Sensitivity metadata for Genesis assets. This structure is intended to preserve
  #   authoritative source markings/designations while minimizing redundant manual entry.
  #   It separates actual source marking/control information from adjacent governance
  #   metadata such as export control, privacy, rights, release, and records status.
  # This sensitivity applies to the dataset described by the asset described by this card, not the data card itself.
  sensitivity:                                  # Sensitivity of the DATASET described by this data card, which may differ from the sensitivity of the data card itself. Populate based on the sensitivity of the dataset alone, not the data card. See NOTE ON SENSITIVITY above.
    overall_sensitivity: ${OVERALL_SENSITIVITY} # [discoverability_required] The overall sensitivity of THE DATASET only.
                                                # Set based solely on the sensitivity of this dataset.
                                                # not the data card it describes. See NOTE ON SENSITIVITY above.
                                                # The sensitivity of the data card and the dataset are independent and will often differ.
                                                #   Uses a controlled vocabulary:
                                                # - Public: No sensitivity; publicly shareable.
                                                # - Unclassified_Uncontrolled: Unclassified but uncontrolled; may have minimal sensitivity; generally shareable with minimal controls.
                                                # - CUI: CUI (Controlled Unclassified Information); requires handling per CUI guidelines; access controls required.
                                                # - UCNI: UCNI (Unclassified Controlled Nuclear Information); requires handling per UCNI guidelines; strict access controls required.
                                                # - Classified: Classified information; requires handling per classification level and guide; strict access controls required.
                                                # - Legacy_Controlled: Legacy controlled information; may have specific handling requirements based on legacy controls; access controls required.
                                                # - Mixed: Mixed sensitivity; contains a combination of sensitive and non-sensitive information; handling requirements depend on the specific content; access controls required.
                                                # - Other_Controlled: Other controlled information; may have specific handling requirements based on other controls; access controls required.
    source_marking_string: __STRING__           # [discoverability_required] If this dataset has a source marking, provide the marking string exactly as it appears on the data card.
    source_marking_scheme: __SCHEME__           # [discoverability_required] If this dataset has a source marking, provide the marking scheme used.
                                                # use vocabulary: DOE_CUI | DOE_UCNI | EO13526_Classified | AEA_RD_FRD_TFNI | DOD_CUI | DHS_CUI | Legacy_OUO | Legacy_Site_Specific | Other_Agency | None
    classified_status: __STATUS__               # [discoverability_required] "Yes" | "No" description: Indicates whether the asset is classified.
    classification_level: __LEVEL__             # [discoverability_if_applicable] For classified information, Top_Secret | Secret | Confidential classification level
    classification_category: []                 # [discoverability_if_applicable] For classified information, list the classification category or categories, if applicable.
                                                # use vocabulary: NSI | RD | FRD | TFNI | Other_Classified
    classified_control_markings: []             # [discoverability_if_applicable] For classified information, list the specific control markings that apply, if any.  
                                                # Provide as a list of unique entries if multiple markings apply.
                                                # e.g., - "NOFORN"
                                                #       - "CNWDI"
                                                #       - "SIGMA 14"
                                                #       - "REL TO USA, CAN, GBR"
                                                #       - "ORCON"
    cui_status: __STATUS__                      # [discoverability_required] "Yes" | "No" description: Indicates whether the asset is CUI.
    cui_basic_categories: []                    # [discoverability_if_applicable, at least one basic or specified category is required if cui_status = "Yes"] For CUI, list the basic category or categories that apply, if any.         
                                                # use DOE/ISOO-authoritative CUI Basic categories or subcategories.
                                                # provide as a list of unique entries if multiple categories apply.
    cui_specified_categories: []                # [discoverability_if_applicable, at least one basic or specified category is required if cui_status = "Yes"] For CUI, list the specified category or categories that apply, if any.   
                                                # use DOE/ISOO-authoritative CUI Specified categories or subcategories.
                                                # provide as a list of unique entries if multiple categories apply.
    cui_limited_dissemination_controls: []      # [discoverability_if_applicable] List the applicable CUI limited dissemination controls, if any. 
                                                # provide as a list of unique entries if multiple controls apply.
                                                # e.g., - "NOFORN"
                                                #       - "DL ONLY"
                                                #       - " REL TO USA, GBR"
                                                #       - "DISPLAY ONLY USA, GBR"
                                                #       - "RELIDO"
                                                # If cui_limited_dissemination_controls contains NOFORN, REL TO..., DISPLAY ONLY...,
                                                # or similar controls, foreign_national_access_status should be consistent with those controls.
    ucni_status: __STATUS__                     # [discoverability_required] "Yes" | "No" description: Indicates whether the asset contains UCNI. UCNI is represented separately
                                                # and should not be treated as an ordinary CUI category value.
    uk_mda_status: __STATUS__                   # [discoverability_if_applicable] "Yes" | "No" | "Unknown" | not_applicable
                                                # Indicates whether the asset is subject to UK Ministry of Defence Assessment (MDA) controls.
    legacy_label_source: __STRING__             # [discoverability_if_applicable]  Preserves deprecated or local historical control labels such as OUO, SBU,
                                                # or site-specific legacy markings as provenance/source information only.
                                                # Provide as a list of unique entries if multiple legacy labels apply.
                                                # E.g., - "OUO"
                                                #      - "SBU"
    normalized_control_basis: __BASIS__         # [discoverability_if_applicable] Optional interpreted control basis used for governance where source materials
                                                # contain legacy, mixed, or non-standard constructs. 
                                                # This does not replace authoritative source markings.
                                                # Provide as a list of unique entries if multiple control bases apply.
                                                # Entries should use this controlled vocabulary:  
                                                # - Classified
                                                # - CUI
                                                # - UCNI
                                                # - Public_Release_Approved
                                                # - Legacy_Needs_Mapping
                                                # - Other_Controlled
  # --- Workflow & Lifecycle ---------------------------------------
  # [discoverability_required] Describes the technical and processing lifecycle position
  # of the dataset. See NOTE ON WORKFLOW STATE vs. RELEASE STATUS
  # in the header for expected alignment with release_status.
  workflow:
    state: ${STATE}                             # [discoverability_required] Current lifecycle position:
                                                #   Raw        — data as collected; no processing applied
                                                #   Processing — actively being cleaned, transformed, or reduced
                                                #   QA         — undergoing quality assurance or validation
                                                #   Analysis   — in active scientific analysis
                                                #   Review     — under formal review (security, export, IRB, etc.)
                                                #   Embargo    — complete but intentionally withheld from release
                                                #   Published  — publicly released
                                                #   Archived   — preserved; no longer actively maintained
                                                #   not_applicable - use when workflow state is not applicable or not yet determined
    is_intermediate: "__Yes|No__"               # [discoverability_if_applicable] "Yes" | "No" if this is an intermediate processing artifact
                                                # rather than a final deliverable. "No" if this is final.
    pipeline_stage: __STAGE__                   # [discoverability_if_applicable] Freetext position in processing pipeline.
                                                # e.g., "post-detector, pre-reconstruction"
                                                # e.g., "raw telemetry, pre-calibration"
    embargo_until: __YYYY-MM-DD__               # [discoverability_if_applicable] Required if state=embargo.
                                                # ISO 8601 date after which release is permitted.

# ============================================================
# ACCESSIBILITY                   [accessibility_required]
# ============================================================
# Metadata elements that describe the accessibility of this dataset, 
# such as access policy, and dataset scale information.
# This is important for users to understand how they can access the dataset and any restrictions that may apply.
# ============================================================
accessibility:                              # [accessibility_required]
  # --- Access Policy ----------------------------------------------
  # Describes who can access this dataset and under what conditions.
  # Access policy for the dataset.
  # Describes the access level and any restrictions or requirements for accessing the dataset,
  #      which is critical information for users to understand how they can access the dataset and any potential barriers to access. 
  #    Access policy is DISTINCT from sensitivity,
  #      which describes the nature of the data and its potential risks) 
  #      and from release status (which describes the publication state of the dataset).
  #    access_policy.access_level is a required field that indicates the level of permissions required for users to access the dataset, following AccessLevelEnum.
  #      - open: no additional permissions required beyond standard account registration and agreement to terms of service.
  #       This indicates that the dataset is freely accessible to the public and can be used without any special permissions or restrictions.
  #       Note that "open" does not necessarily mean that the dataset is free of copyright or other legal restrictions, but rather that there are no additional access controls in place.
  #       Users may still need to comply with any applicable laws or regulations when using the dataset.
  #      - restricted: access may be granted to users who meet certain criteria, such as being part of a specific research community, having a legitimate research purpose, or agreeing to specific terms and conditions. 
  #       This indicates that the dataset is not freely accessible to the public and that users must meet certain requirements or restrictions in order to access it.
  #       The specific criteria for access may vary depending on the dataset and the organization providing it, but could include things like institutional affiliation, research purpose, or agreement to specific terms and conditions.
  #      - controlled: access is tightly controlled and may require specific authorization, agreements, or approvals. This indicates that the dataset contains sensitive information and that only authorized users can access it.
  access_policy:                                # [accessibility_required]
    access_level: ${LEVEL}                      # [accessibility_required] Open | Restricted | Controlled
    access_restrictions: __RESTRICTIONS__       # [accessibility_if_applicable] Freetext description of access restrictions.
                                                # e.g., "Requires signed DUA" | "None - publicly accessible"
    authorization_required: ${AUTH}             # [accessibility_if_applicable] Required if access_level is not open. 
                                                # List of authorization needed to access this dataset:                
                                                #   Account               — registered account required
                                                #   User_Agreement        — user agreement or terms of service
                                                #   Data_Use_Agreement    — formal DUA required
                                                #   Sponsor_Approval      — sponsor or PI approval required
                                                #   Export_Control_Review — export control review required
                                                #   IRB_Approval          — IRB approval required
                                                #   Other                 — describe in access_restrictions
    intended_partner_classes: []                # [accessibility_if_applicable] List of intended partner classes or user groups for this dataset, if any.
                                                # from controlled vocabulary: 
                                                # Internal_Team | Tri_Lab | DOE_NNSA_Lab | Federal_Partner | Contractor | Academic_Researchers | External_Research_Partner | Public | Industry_Partner | Other
                                                # If absent, or null, this field is not yet known or determined. Use an empty list if definitively no specific partner classes are targeted.
                                                # Use public if this dataset is intended for broad public use without restrictions.
    approved_environments: []                   # [accessibility_if_applicable]
                                                # Describe the approved environment for access. List of approved environments, 
                                                # if more than one — e.g., "DOE HPC facilities with export control review" | "On-site access only at Oak Ridge National Laboratory"
                                                # [] means no explicitly approved environments; access may still be granted on a case-by-case basis.
                                                # null or absent means it has not yet been determined whether approved environments are required.
    policy_url: __URL__                         # [accessibility_if_applicable] URL to the full access policy document
    policy_text: __TEXT__                       # [accessibility_if_applicable] Inline summary if no policy_url exists


  # --- Access Endpoints -------------------------------------------
  # Complete the fields you know at the time of data card creation.
  # Repository-assigned fields (landing pages, accession numbers,
  # access protocols) will be populated by the managing repository
  # or catalog system at ingest — see the REPOSITORY-MANAGED block.
  access:                                     # [accessibility_required]
    current_location: __PATH_OR_URL__         # [accessibility_required] Where the data physically resides right now.
                                              # Use for in-workflow data not yet deposited in a repository,
                                              # or for any dataset with a known internal or external storage path.
                                              # e.g., /mnt/ecs/scientific-data/project/dataset/
                                              # e.g., /lustre/orion/proj-shared/dataset/
                                              # e.g., s3://genesis-bucket/dataset/
    publicly_facing_landing_page_url: __URL__ # [accessibility_if_applicable] URL to the publicly facing landing page for this dataset.
                                              # This is the URL that should be shared publicly and included in citations.
                                              # It may differ from the current_location if the dataset is not yet publicly released or if the current_location is an internal storage path.
    intended_repositories:                    # [accessibility_if_applicable] Repositories you intend to deposit or have deposited
                                              # this dataset in. The managing repository or catalog system will
                                              # resolve and populate repository-assigned fields at ingest
                                              # (see REPOSITORY-MANAGED block). Repositories may be institutional,
                                              # project-owned, community, or national (e.g., OSTI, Zenodo,
                                              # institutional data repository, project data store).
      - name: __NAME__                        # [accessibility_if_applicable] e.g., "OSTI Data Explorer" | "Zenodo" | "Globus" | "internal"
        access_level: __LEVEL__               # [accessibility_if_applicable] Intended access level: Open | Restricted | Controlled
                                              # The same dataset may have different access levels per repository.
        is_primary: "__Yes|No__"              # [accessibility_if_applicable] "Yes" | "No" — only one entry should be marked "Yes"
        date_deposited: __YYYY-MM-DD__        # [accessibility_if_applicable]
        data_services:                        # [accessibility_if_applicable] Populate if Data Service / API endpoints exists for this dataset
                                              # aligns with dcterms:DataService. If more than one data service or API endpoint exists, list them all.
          - name: __NAME__                    # e.g., "REST API" | "GraphQL endpoint"
            endpoint: __URL__
            documentation_url: __URL__
            authentication: __AUTH__           # None | API_Key | OAuth2 | SAML | Certificate | OpenID_Connect | Basic_Auth | Bearer_Token | Other
            version: __VERSION__
            rate_limit: __LIMIT__              # e.g., "1000 requests/hour"

  # --- Dataset Scale & Size Metrics -------------------------------------------
  # These fields describe the scale of the dataset, which is important for users to understand the scope and potential resource requirements for using the dataset. 
  # record_count and record_unit provide a standardized way to describe the number of primary records, samples, files, or other relevant units in the dataset, which is critical for understanding the dataset's size and complexity. 
  # compressed_bytes and uncompressed_bytes provide information about the storage requirements for the dataset, which is important for users to plan
  dataset_scale:                              # [accessibility_if_applicable]
    record_count: __COUNT__                   # [accessibility_if_applicable] Number of primary records, samples, or files
    record_unit: __UNIT__                     # [accessibility_if_applicable] samples | files | records | timesteps | images | tokens | other
    compressed_bytes: __BYTES__               # [accessibility_if_applicable] Total size when compressed, in bytes
    uncompressed_bytes: __BYTES__             # [accessibility_if_applicable] Total size when uncompressed, in bytes


# ============================================================
# INTEROPERABILITY                   [interoperability_required]
# ============================================================
# Metadata elements that describe the interoperability of this dataset, 
# such as context of data collection, data structure, provenance, related resource, schema, and integrity.
# This is important for users to understand how they can use the dataset and what tools or software they may need to work with it.
# ============================================================
# --- Dataset Structure including format, encoding, and features ------------------------------------
interoperability:                             # [interoperability_required]
  data_structure:                             # [interoperability_required]
    formats: []                               # [interoperability_required] File formats in this dataset.
                                              # e.g., ["CSV", "HDF5", "NetCDF4", "Parquet", "TIFF", "JSON"]
    encoding: __ENCODING__                    # [interoperability_if_applicable] Character encoding for text-based formats.
                                              # e.g., UTF-8 | ASCII | Latin-1
                                              # UTF-8 strongly recommended. Use not_applicable for binary formats.
    schema_version: __VERSION__               # [interoperability_if_applicable] Version of the data schema used in this dataset.
                                              # Distinct from data card_version. Increment when field names,
                                              # types, or structure change between dataset versions.
    modalities: []                            # [interoperability_required] Data modalities present.
                                              # e.g., ["tabular", "image", "time-series", "text", "graph", "point-cloud"]
    features: []                              # [interoperability_required] Primary variables, fields, or features.
                                              # IMPORTANT: choose ONE form and use it consistently — do not mix.
                                              #
                                              # For basic documentation — flat string list:
                                              # - name: temperature
                                              # - name: pressure
                                              # - name: timestamp
                                              # - name: label
                                              #
                                              # To support  AI-ready data — structured form (replace flat list above):
                                              # - name: temperature:
                                              #   data_type: float           # float | int | string | boolean | datetime | other
                                              #   unit: Kelvin
                                              #   description: Sample temperature at time of measurement
                                              #   range: "273.15 - 373.15"
    splits: []                                # [interoperability_if_applicable] Dataset splits if pre-divided.
                                              # e.g., ["train", "test", "validation"]
    language: __LANG__                        # [interoperability_if_applicable] ISO 639-1 language code for dataset content
                                              # (e.g., text corpora, annotation labels).
                                              # Distinct from data card.language. Use not_applicable for
                                              # non-linguistic data (numeric, image, simulation output, etc.)
    spatial_coverage:                         # [interoperability_if_applicable] Geographic coverage of the dataset.
                                              # Use for geospatial datasets or facility-based experiments.
      description: __DESC__                   # [interoperability_if_applicable] e.g., "Continental United States" | "SNS Beamline 1B, ORNL"
      geo_location_box:                       # [interoperability_if_applicable] WGS84 decimal degrees; use for area coverage
                                              # aligns with datacite:geoLocationBox
        westBoundLongitude: __DECIMAL_DEG__   # aligns with datacite:westBoundLongitude
        eastBoundLongitude: __DECIMAL_DEG__.  # aligns with datacite:eastBoundLongitude
        southBoundLatitude: __DECIMAL_DEG__   # aligns with datacite:southBoundLatitude
        northBoundLatitude: __DECIMAL_DEG__   # aligns with datacite:northBoundLatitude
    temporal_coverage:                        # [interoperability_if_applicable] Time period the dataset content represents.
                                              # aligns with schema:temporalCoverage
                                              # NOTE: distinct from dates.data_collection_start/end, which describe
                                              # when collection occurred. Use temporal_coverage when the dataset
                                              # describes a specific historical or projected time period that differs
                                              # from when collection happened.
                                              # e.g., "Monthly climate averages 1950–2020" collected in 2024:
                                              #   temporal_coverage.start = 1950-01-01
                                              #   dates.data_collection_start = 2024-01-01
      start_date: __YYYY-MM-DD__              # [interoperability_if_applicable] aligns with dcterms:coverage
      end_date: __YYYY-MM-DD__                # [interoperability_if_applicable] aligns with dcterms:coverage
      description: __DESC__                   # [interoperability_if_applicable]

  # --- Provenance -------------------------------------------------
  # Describes how this dataset was created, what it was derived
  # from, and what processing was applied.
  provenance:
    was_generated_by: __DESCRIPTION__         # [interoperability_required] High-level description of the generating process.
                                              # Even a one-line answer dramatically improves catalog value.
                                              # e.g., "Neutron scattering experiment at SNS Beamline 1B"
                                              # e.g., "Monte Carlo simulation using MCNP 6.2"
                                              # e.g., "Derived from raw telemetry via calibration pipeline v2.1"
    source_data:                              # [interoperability_if_applicable] Source datasets this dataset was derived from.
      - name: __NAME__
        identifier:
          type: __TYPE__                      # doi | ark | handle | url | local | other
          value: __VALUE__
        relationship: __REL__                 # is_derived_from | is_based_on | is_part_of | has_part | references | other
    processing_steps: __DESCRIPTION__         # [interoperability_required] Key processing, cleaning, calibration, or
                                              # transformation steps applied to produce this dataset.
    instrumentation: __DESCRIPTION__          # [interoperability_if_applicable] Instruments, sensors, detectors, or equipment used.
                                              # Include make, model, and version where relevant.
    simulation_details: __DESC__              # [interoperability_if_applicable] For simulation-derived data: code, version, key
                                              # parameters, and configuration.
                                              # e.g., "LAMMPS 23Jun2022, NVT ensemble, 300K, 10ns run, CHARMM36"
    software_environment:                     # [interoperability_if_applicable] Software environment used to generate or process
                                              # this dataset. Captures what is needed for computational reproducibility.
      os: __OS__                              # [interoperability_if_applicable] e.g., "RHEL 8.6" | "Ubuntu 22.04"
      compiler: __COMPILER__                  # [interoperability_if_applicable] e.g., "GCC 11.3" | "Intel oneAPI 2023.1"
      container: __CONTAINER__                # [interoperability_if_applicable] e.g., "docker://registry/image:tag"
      hpc_environment: __ENV__                # [interoperability_if_applicable] e.g., "module load python/3.10 cuda/11.8 openmpi/4.1"
      notes: __NOTES__                        # [interoperability_if_applicable] Additional environment details, key library versions,
                                              # or reference to a full environment manifest.
                                              # e.g., "See requirements.txt in dataset root"
                                              # e.g., "numpy 1.24, pytorch 2.0.1, h5py 3.8.0"
  # --- Dates ------------------------------------------------------
  dates:                                     # [interoperability_if_applicable]
    data_collection_start: __YYYY-MM-DD__    # [interoperability_if_applicable] ISO 8601 date data collection or generation began
    data_collection_end: __YYYY-MM-DD__      # [interoperability_if_applicable] ISO 8601 date data collection or generation ended
    issued: __YYYY-MM-DD__                   # [interoperability_if_applicable] ISO 8601 date the dataset was first publicly released
    modified: __YYYY-MM-DD__                 # [interoperability_if_applicable] ISO 8601 date of most recent significant modification

  # --- Semantic Layer ---------------------------------------------
  # [interoperability_if_applicable]
  # To support agentic-use, federated or cross-domain use, populate schema_url at minimum.
  semantic_layer:                             # [interoperability_if_applicable]
    schema_url: __URL__                       # [interoperability_if_applicable] URL to a formal schema for this dataset.
                                              # e.g., JSON Schema | XML Schema | NeXus application definition
    semantic_context: []                      # [interoperability_if_applicable] Semantic conventions applied.
                                              # e.g., "NetCDF CF Conventions 1.10" | "NeXus NXmonopd"

  # --- Related Resources ------------------------------------------
  # [interoperability_if_applicable] Links to related datasets, publications,
  # software, and AI models. The base relationship vocabulary is
  # shared across all resource types; extended terms are available
  # for software and AI models.
  #
  # Base vocabulary (all types):
  #   is_derived_from | is_based_on | is_part_of | has_part | references | other
  # Extended (software and AI models):
  #   used_to_create | used_to_process | used_to_analyze | trained_on | evaluated_on
  related_resources:                          # [interoperability_if_applicable]
    datasets: []
    # - name: __NAME__
    #   identifier:
    #     type: __TYPE__                      # doi | ark | handle | url | local | other
    #     value: __VALUE__
    #   relationship: __REL__                 # see vocabulary above

    publications: []
    # - type: __TYPE__                        # doi | ark | arxiv | url | report | other
    #   value: __VALUE__
    #   relationship: __REL__                 # see vocabulary above

    software: []
    # - name: __NAME__
    #   version: __VERSION__
    #   identifier:
    #     type: __TYPE__                      # doi | ark | handle | url | local | other
    #     value: __VALUE__
    #   relationship: __REL__                 # see vocabulary above

    ai_models: []
    # - name: __NAME__
    #   version: __VERSION__
    #   accessed_date: __YYYY-MM-DD__
    #   identifier:
    #     type: __TYPE__                      # doi | ark | handle | url | local | other
    #     value: __VALUE__
    #   relationship: __REL__                 # see vocabulary above

  # --- Domain Metadata ------------------------------------------
  # Any additional domain-specific metadata not captured in the data card.
  # allows multiple entries to support multiple domains or schemas within a single dataset.
  # Domain-specific metadata fields supplement the Discoverable card 
  # and should not replace the common metadata expected by the data card.
  domain_metadata:                        # [interoperability_if_applicable] e.g., "Accelerator Operations Metadata" | "Climate Data Variables"
    - name: __NAME__
      description: __DESCRIPTION__        # [interoperability_if_applicable] Free-text description of the domain-specific metadata, its purpose, and any important details.
      science_domain: __DOMAIN__          # [interoperability_if_applicable] e.g., accelerator_operations | climate | ...
      schema_reference:                   # [interoperability_if_applicable]
        type: __TYPE__       # doi | url | ark | handle | local | other
        value: __VALUE__
      version: __VERSION__
      fields:                             # [interoperability_if_applicable] Key-value pairs of domain-specific metadata fields. The specific fields will depend on the domain and schema referenced above.
        FIELD_NAME:                       # ${FIELD_NAME} [interoperability_if_applicable] The name of the domain-specific metadata field.
          field_value: __VALUE__          # [interoperability_if_applicable] The value for this domain-specific metadata field. The specific value will depend on the field and schema referenced above.
          data_type: __DATATYPE__         # [interoperability_if_applicable] The data type of the value (e.g., string, integer, float, boolean).
          unit: __UNIT__                  # [interoperability_if_applicable] The unit of measurement for the value, if applicable.
          description: __DESCRIPTION__    # [interoperability_if_applicable] A description of the field and its significance.
# ============================================================
# REUSABILITY                   [reusability_required]
# ============================================================
# Metadata elements that describe the reusability of this dataset, 
# such as license and rights, stewardship, data_quality, integrity, citation and stewardship information.
# This is important for users to understand the legal and ethical considerations for using the dataset, 
# as well as who is responsible for maintaining it and how it has been reviewed for quality and compliance.
# ============================================================
reusability:                              # [reusability_required] Information about the reusability of this dataset, such as license and rights, stewardship, data_quality, integrity, citation and stewardship information.
  # --- License & Rights ----------------------------------------------------
  # [reusability_if_applicable] Important: Required when release_status = Approved | Published.
  # Use "pending" if not yet assigned.
  # Includes information about the license governing use of the dataset, as well as any additional legal rights statements.
  # NOTE ON LICENSES AND GOVERNANCE:  
  #   A public/open license is not always the governing instrument for use,
  #   some controlled datasets may not have an SPDX-style reuse license at all,
  #   and use may instead be governed by contract, agreement, institutional review, or repository policy.
  license:
    spdx_id: __SPDX_ID__                      # [reusability_if_applicable] SPDX license identifier: https://spdx.org/licenses/
                                              # e.g., CC-BY-4.0 | CC0-1.0 | Apache-2.0 | MIT
                                              # Use "Other" if not in SPDX registry. Use "pending" if not yet assigned.
    name: __LICENSE_NAME__                    # [reusability_if_applicable] Required if spdx_id=Other
    url: __LICENSE_URL__                      # [reusability_if_applicable] URL to license text or "LICENSE.md" for repo-local file
    known_contractual_rights: __RIGHTS__      # [reusability_if_applicable] Legal rights statement, separate from license. 
                                              # Important because DOE/NNSA datasets may have complex contractual arrangements that 
                                              # impact how the data can be used and shared beyond license terms.
                                              # e.g., "Government has unlimited rights"
         
                                              # e.g., "Contractor retains rights with government license"
  additional_licenses: []                     # [reusability_if_applicable] List of additional licenses that apply to subsets of the dataset, if any.
                                              # e.g., if a dataset contains third-party data with different licensing terms, those can be captured here.
                                              # Each entry should include the same fields as the main license block above, along with a description of which subset of the data it applies to.

  # --- Stewardship & Versioning -----------------------------------
  # [reusability_if_applicable]
  #   NOTE ON VERSIONING: Three fields work together to describe versioning:
  #   identification.version        — the version number of this dataset
  #   identification.supersedes /
  #   identification.superseded_by  — links to prior and successor versions
  #   stewardship.versioning_strategy — how versioning is managed over time
  stewardship:                                # [reusability_if_applicable] Information about the stewardship of this dataset, including who is responsible for maintaining it and how versioning is managed over time.
    level: __LEVEL__                          # [reusability_if_applicable] Select one: Project_Managed | Repository_Managed | Externally_Managed | not_applicable
    maintainer:                               # [reusability_if_applicable] Person or organization responsible for ongoing maintenance.
      type: __TYPE__                          # person | organization
      person:
        given_name: __GIVEN_NAME__           # [reusability_if_applicable]
        family_name: __FAMILY_NAME__         # [reusability_if_applicable]
        orcid: __ORCID__                     # [reusability_if_applicable]
                                             # Required where DOE employee/contractor author policy applies, if locally applicable
        email: __EMAIL__                     # [reusability_if_applicable]
        affiliation:
          name: __ORG_NAME__                 # [reusability_if_applicable]
          ror_id: __ROR_ID__                 # [reusability_if_applicable]
      organization:
        name: __ORG_NAME__                    # [reusability_if_applicable]
        ror_id: __ROR_ID__                    # [reusability_if_applicable]
    update_frequency: __FREQ__                # [reusability_if_applicable] None | Ad_Hoc | Monthly | Quarterly | Annually | Continuously | Other
    retention_policy: __POLICY__              # [reusability_if_applicable] e.g., "Retained for 10 years per DOE data management policy"
    versioning_strategy: __STRATEGY__         # [reusability_if_applicable] e.g., "Semantic versioning; all versions retained in Zenodo"
                                              # e.g., "Major versions only; prior versions available on request"

  # --- Data Quality -----------------------------------------------
  # [reusability_required] Be specific — vague entries reduce trust and reuse.
  data_quality:                              # [reusability_required]
    completeness: __DESCRIPTION__            # [reusability_required] e.g., "All detector channels present; 2% of timesteps
                                             # missing due to instrument downtime on 2023-04-12"
    known_issues: __DESCRIPTION__            # [reusability_required] e.g., "Sensor drift observed after 2023-06-01T12:00:00Z"
    validation_methods: __DESC__             # [reusability_required] e.g., "Cross-validated against NIST SRM 640f"
    noise_characteristics: __DESC__          # [reusability_if_applicable]
    uncertainty_notes: __NOTES__             # [reusability_if_applicable] e.g., "Measurement uncertainty ±0.5% (k=2) per ISO/IEC Guide 98-3"
    missing_data_codes: []                   # [reusability_if_applicable]
    # - code: __CODE__                       # e.g., -999 | NaN | NULL
    #   description: __DESC__                # e.g., "Sensor malfunction" | "Below detection limit"

  # --- Dataset Citation ---------------------------------------------------
  # [reusability_if_applicable] Important:Populate when dataset release_status = Approved | Published.
  # Replace ALL ${...} placeholders in the BibTeX block below before publishing.
  citation:                           # [reusability_if_applicable]
    report_number: __NUMBER__         # [reusability_if_applicable] e.g., SAND2024-XXXXX | LAUR-XX-XXXXX | ORNL/TM-2024/XXXXX
    preferred_citation:               # [reusability_if_applicable]
      author: ${AUTHOR}               # [reusability_if_applicable, required if preferred_citation is included] e.g., "Smith, John A.; Doe, Jane B."
      title: ${DATASET_NAME}          # [reusability_if_applicable, required if preferred_citation is included] e.g., "Neutron Scattering Data from SNS Beamline 1B, April 2023"
      year: ${YEAR}                   # [reusability_if_applicable, required if preferred_citation is included] e.g., 2024
      publisher: ${PUBLISHER}         # [reusability_if_applicable, either preferred_citation or howpublished is required] e.g., "Oak Ridge National Laboratory" | "DOE NNSA" | "University of X"
      howpublished: __HOWPUBLISHED__  # [reusability_if_applicable, either preferred_citation or howpublished is required] e.g., "(Version v1) [Data set]. Zenodo" | "Available at https://doi.org/10.1234/zenodo.1234567"
      doi: ${DOI}                     # [reusability_if_applicable, either doi or url is required] e.g., "10.1234/zenodo.1234567"
      url: ${URL}                     # [reusability_if_applicable, either doi or url is required] e.g., "https://doi.org/10.1234/zenodo.1234567" 
      eprinttype: ${EPRINT_TYPE}      # [reusability_if_applicable] e.g., arxiv | biorxiv | report_number | other
      eprint: ${EPRINT}               # [reusability_if_applicable] e.g., "1234.56789" | "SAND2024-XXXXX
      note: ${NOTE}                   # [reusability_if_applicable] e.g., "Available at \url{ark:/12345/abcde}""
                                      # For legacy bibtex entries (that don't accept eprinttype and eprint) and that need to support an ark or other identifiers that don't fit cleanly into the existing fields, the note field can be used to capture this information in a free-text format.
                                      # include a note: field use this format for the note field: note: Available at \url{ark:/12345/abcde}
  # --- Integrity & Fixity -----------------------------------------
  # [reusability_if_applicable] Checksums enable automated validation of data
  # integrity after transfer or storage.
  integrity:                                # [reusability_if_applicable]
    checksum_available: "__Yes|No__"        # [reusability_if_applicable] "Yes" | "No"
    checksum_type: __TYPE__                 # [required if checksum_available="Yes"] sha256 | sha512 | md5 | other
                                            # sha256 recommended; md5 not recommended for new datasets
    checksum_value: __VALUE__               # [required if checksum_available="Yes"] Checksum of primary data file(s).
                                            # For multi-file datasets, provide a checksum manifest and link here.
    fixity_policy: __POLICY__               # [reusability_if_applicable] e.g., "Monthly sha256 verification via repository integrity service"

# ============================================================
# GOVERNED USE                   [governed_use_required]
# ============================================================
# Metadata elements that describe the governed use of this dataset, 
# such as compliance information, use governance, and review history.
# This is important for users to understand any compliance requirements, restrictions, or governance processes that apply to the dataset, as well as the history of any formal reviews it has undergone.
# =========================================================
governed_use:
  # --- Use Governance -------------------------------------------------
  # [governed_use_required] For datasets that are actively being used in workflows, 
  # or where use governance is needed to manage risks, ensure responsible use, 
  # or enable discoverability for specific use cases. 
  # Populate the fields that are relevant to the dataset's current, intended, permitted, out_of_scope, and prohibited use.
  # current_use is required for governed_use_required; the other fields are optional but recommended to support responsible use and discoverability.
  use_governance:                           # [governed_use_required]
    current_use: __CURRENT_USE__            # [governed_use_required] For in-workflow data: what is this dataset actively
                                            # being used for right now? Distinct from intended_use.
    intended_use: __INTENDED_USE__          # [governed_use_if_applicable] Tasks or workflows this dataset is designed to support.
                                            # e.g., ML training | physics analysis | benchmarking | visualization
    permitted_use: __PERMITTED_USE__        # [governed_use_if_applicable] Uses this dataset is suitable for, beyond the intended use.
                                            # e.g., exploratory analysis | hypothesis generation | educational use
    out_of_scope_use: __OUT_OF_SCOPE__      # [governed_use_if_applicable] Uses this dataset should NOT be applied to.
                                            # e.g., clinical decision-making | real-time control systems
    prohibited_use: __PROHIBITED_USE__             # [governed_use_if_applicable] Uses that are explicitly prohibited for this dataset.
                                            # e.g., any use involving human subjects | commercial applications | use in high-risk domains  
    need_to_know_basis: []                  # [governed_use_if_applicable] If access is restricted based on a need-to-know basis, list the specific basis for the restriction.
                                            # select one from list: "Mission_Need" | "Job_Duty" | "Project_Program_Association" | "Agreement_Defined" | "DGB_Exception_Waiver"
                                              

  # --- Non-Sensitivity Governance Metadata -------------------------------------------------
  # [governed_use_required] Governance-relevant metadata that may affect sharing/use decisions but is not
  #  part of the source sensitivity/marking block itself.
  # This refers to the non-sensitivity governance as it applies to the dataset, which may be distinct from the sensitivity or classification of the source data from which it was derived.
  # =========================================================
  non_sensitivity_governance_metadata:                   # [governed_use_required] export control, privacy, right & release as it applies to the dataset as a whole, which may be distinct from the sensitivity or classification of the source data from which it was derived.
    # Export Control & Foreign National Access -----------------------------------------
    export_control:                                      # [governed_use_required]
      export_control_status: __EXPORT_CONTROL_STATUS__   # [governed_use_required] select one from list: "Yes" | "No" | "Pending_Review" | "Unknown"
      export_control_basis: __EXPORT_CONTROL_BASIS__     # [governed_use_if_applicable, required if export_control_status = "Yes"] select one from:
                                                         # ITAR | EAR | DOE_Nuclear_Export_Control | Other | not_applicable
      foreign_national_access_status: __ACCESS_STATUS__  # [governed_use_if_applicable] select one from list: Allowed | Restricted | Prohibited | Conditional | Unknown
      # if cui_limited_dissemination_controls includes NOFORN / REL TO / similar, foreign_national_access_status should be consistent
    
    # Privacy & Human Subjects -----------------------------------------
    privacy:                                             # [governed_use_required]
      privacy_status: __PRIVACY_STATUS__                 # [governed_use_required] select one from list: "Yes" | "No" | "Pending_Review" | "Unknown"
      pii_status: __PII_STATUS__                         # [governed_use_required] select one from list: "Yes" | "No" | "Pending_Review" | "Unknown"
      phi_status: __PHI_STATUS__                         # [governed_use_required] select one from list: "Yes" | "No" | "Pending_Review" | "Unknown"
      privacy_control_basis: []                            # [governed_use_if_applicable] select all that apply: HIPPA | Privacy_Act | Human_Subjects | Other_Regulated_Privacy | Site_Specific | not_applicable
      privacy_regime_notes: __PRIVACY_NOTES__            # [governed_use_if_applicable] Optional notes for privacy regimes or handling nuances not captured by controlled values.

    # Rights & Agreements -----------------------------------------
    rights_release_records:                              # [governed_use_required]
      ip_restriction_type: __IP_RESTRICTION_TYPE__       # [governed_use_if_applicable] select one from list: Proprietary | Limited_Rights | Restricted_Rights | Government_Purpose_Rights | Unlimited_Rights | Third_Party_Licensed | None
      agreement_required: "__Yes|No__"                   # [governed_use_required] select one from list: "Yes" | "No" — Is a rights release agreement required for use of this dataset?
      agreement_type: []                                 # [governed_use_if_applicable, required if agreement_required = "Yes"] list all that apply: DUA | CRADA | MOU | NDA | LICENSE | WFO | OTHER
      public_release_status: __PUBLIC_RELEASE_STATUS__   # [governed_use_required] select one from list: "Approved" | "Pending" | "Not_Approved" | "Requires_STI_Review"
      record_status: __RECORD_STATUS__                   # [governed_use_required] select one from list: "Federal_Record" | "Contractor_Record" | "Non_Record" | "Mixed" | "Unknown"

  # --- Compliance -------------------------------------------------
  # [governed_use_required] Populate when release_status = Under_Review | Approved | Published.
  # Leave blank or omit for draft and in-workflow datasets.
  compliance:                                # [governed_use_required]
    doe_data_management_plan: "__Yes|No|Unknown__"       # [governed_use_required] select one from list: "Yes" | "No" | "Unknown" — a DOE DMP is on file for this dataset
    osti_elink2_metadata_compliant: "__Yes|No|Unknown__" # [governed_use_required] select one from list: "Yes" | "No" | "Unknown" — metadata complies with OSTI E-Link 2 API specs
    irb_approved: "__Yes|No|Unknown|not_applicable__"    # [governed_use_required] select one from list: "Yes" | "No" | "Unknown" | "not_applicable" - IRB approval is in place for this dataset, if applicable

  # --- Review Provenance Companion  ---------------------------------------------
  # [governed_use_if_applicable] Optional companion block for review/provenance data that the team has indicated
  #  should exist somewhere in the broader card/model.
  # This block extends the Genesis Sensitivity V2 review_provenance_companion (which only accepts a single review) by allowing multiple review records to be captured in a structured format, 
  # which is especially useful for datasets that have undergone multiple reviews or have complex provenance histories.
  review_provenance_companion:                      # [governed_use_if_applicable] This is especially useful to track the provenance of the review.
    - source_review_reference: __REVIEW_REFERENCE__ # [governed_use_if_applicable] e.g., internal_qa | security | export_control | irb | partner | publication | other
      review_purpose: __PURPOSE__                   # [governed_use_if_applicable] e.g., "Export control review prior to public release"
      source_review_authority: __AUTHORITY__        # [governed_use_if_applicable] e.g., "DOE Export Control Officer" | "ORNL IRB"
      review_contact_name: __CONTACT_NAME__         # [governed_use_if_applicable] Name of the primary contact for this review, if applicable.
      review_contact_email: __CONTACT_EMAIL__       # [governed_use_if_applicable] Email of the primary contact for this review, if applicable.
      reviewed_by:                                  # [governed_use_if_applicable] Delete the block that does not apply.
        type: __TYPE__                              # person | organization
        person:
          given_name: __GIVEN_NAME__                # [governed_use_if_applicable]
          family_name: __FAMILY_NAME__              # [governed_use_if_applicable]
          email: __EMAIL__                          # [governed_use_if_applicable]
          ror_id: __ROR_ID__                        # [governed_use_if_applicable]
        organization:
          name: __ORG_NAME__                        # [governed_use_if_applicable]
          ror_id: __ROR_ID__                        # [governed_use_if_applicable]
      decontrol_or_declassify_on: "__YYYY-MM-DD__"  # [governed_use_if_applicable] If provided, use "YYYY-MM-DD" format or "not_applicable", for export-controlled or classified datasets, the date when the dataset will be decontrolled or declassified, if known.
      review_date: "__YYYY-MM-DD__"                 # [governed_use_if_applicable] If provided, use "YYYY-MM-DD" format or "not_applicable"
      comments: __COMMENTS__                        # [governed_use_if_applicable]

# ============================================================
# AI USABILITY    [ai_usability_required]
# ============================================================
# Required for the ai_usability intended capability, or for any dataset used
# in AI/ML training, inference, or evaluation workflows, or
# where semantic interoperability and verifiable integrity
# are needed.
# ============================================================
ai_usability:
  # --- AI / ML Usage ----------------------------------------------
  # [ai_ready] Describes whether and how this dataset may be used
  # in AI/ML workflows. Be explicit — these fields are read by
  # automated pipeline tooling.
  ai_usage:
    training_use_allowed: __ALLOWED__           # [ai_usability_required] "Yes" | "No" | "Conditional"
    inference_use_allowed: __ALLOWED__          # [ai_usability_required] "Yes" | "No" | "Conditional"
    evaluation_use_allowed: __ALLOWED__         # [ai_usability_required] "Yes" | "No" | "Conditional"
    restrictions: __DESCRIPTION__               # [ai_usability_required] e.g., "Not for clinical decision-making" | "None"
    bias_risks: __DESCRIPTION__                 # [ai_usability_required] e.g., "Overrepresents samples from facility X" | "None"
    safety_considerations: __DESC__             # [ai_usability_required] e.g., "Outputs may be export-controlled" | "None"
    human_review_required: "__Yes|No__"         # [ai_usability_required] "Yes" | "No"

# ------------------------------------------------------------
# REPOSITORY-MANAGED
# ONLY HERE FOR REFERENCE - DO NOT INCLUDE THIS BLOCK IN THE FINAL DATA CARD
# Populated by the managing repository or catalog system at
# ingest. Do not edit manually. The managing system may be
# institutional, project-owned, community, or national
# (e.g., OSTI, Zenodo, an institutional data repository,
# or a project data store). Fields here are authoritative
# as assigned by that system.
# ------------------------------------------------------------
_repository:                               # [reference_only_do_not_include] Repository-managed metadata fields. Do not edit manually, nor include in completed data card.
  populated_by_repository: true            # [reference_only_do_not_include] Always true; signals to parsers this block is system-owned
  ingest_date: null                        # [reference_only_do_not_include] ISO 8601 date this data card was ingested by the managing system
  repository_catalog_id: null              # [reference_only_do_not_include] Identifier assigned to this data card by the managing catalog
  completeness_score: null                 # [reference_only_do_not_include] Catalog-computed completeness score against completeness of fields in declared inteded_capabilities
  datacard_checksum:                        # [reference_only_do_not_include] Integrity record for this data card document file
    type: null                              # [reference_only_do_not_include] sha256 | sha512 — checksum algorithm used
    value: null                             # [reference_only_do_not_include] Checksum of the raw data card .md file as ingested.
                                            # Recomputed on each ingest to detect post-ingest modifications.
  repositories:                             # [reference_only_do_not_include] Resolved repository records keyed to access.intended_repositories
    - name: ""                              # [reference_only_do_not_include] Echoed from access.intended_repositories.name
      identifier:
        type: null                          # [reference_only_do_not_include] ror | url | local | other
        value: null                         # [reference_only_do_not_include] Authoritative repository identifier; ROR ID preferred
      dataset_landing_page: null            # [reference_only_do_not_include] Human-readable dataset page assigned by the repository
      dataset_download_url: null            # [reference_only_do_not_include] Direct download URL assigned by the repository
      dataset_id_in_repo: null              # [reference_only_do_not_include] Accession number or ID assigned by this repository
      access_protocol: null                 # [reference_only_do_not_include] https | ftp | s3 | globus | nfs | lustre | other
  usage_metrics:                            # [reference_only_do_not_include] Populated by the managing repository; do not edit
    download_count: null
    view_count: null
    citation_count: null
    last_accessed: null
  distributions: []                         # [reference_only_do_not_include] Distribution records populated at ingest
  data_services: []                         # [reference_only_do_not_include] Data service endpoints populated at ingest